name: الاختبارات

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# دفعة جديدة تُلغي تشغيلًا سابقًا على الفرع نفسه — لا فائدة من انتظار
# نتيجة كود تجاوزناه.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  javascript:
    name: جافاسكربت — المحرك المرجعي
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # data/*.json هي المصدر الوحيد، ولها أربع نسخ مولَّدة: وحدة
      # للمتصفح، وموارد حزمة Swift، والملف الواحد، وجدول البحور في
      # التوثيق. هذا يمنع انحراف أيٍّ منها عن المصدر بصمت.
      - name: النسخ المولَّدة تطابق المصدر
        run: |
          node tools/bundle-data.js --check
          node tools/build-standalone.js --check
          node tools/build-meters-doc.js --check

      - name: الاختبارات
        run: node tests/run.js

      - name: صحة ملفات JSON
        run: |
          for f in data/*.json; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" \
              || { echo "✗ JSON غير صالح: $f"; exit 1; }
            echo "✓ $f"
          done

  swift:
    name: Swift — حزمة المحرك
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      # وضع الإصدار مقصود: مصفوفة الاختبار تمرّ على كل صيغة × كل بحر،
      # وبناء التصحيح غير المحسَّن يجعلها بطيئة إلى حدّ غير عملي.
      # -enable-testing يبقي @testable عاملًا في وضع الإصدار.
      - name: البناء
        working-directory: swift
        run: swift build -c release -Xswiftc -enable-testing

      # صورة swift تشغّل sh (dash) ولا pipefail فيها.
      - name: الاختبارات
        working-directory: swift
        shell: bash
        timeout-minutes: 20
        run: |
          set -o pipefail
          swift test -c release -Xswiftc -enable-testing 2>&1 | tee test-output.txt || {
            echo "───────── السطور الدالّة ─────────"
            grep -nE "Test Case|Fatal error|error:|XCTAssert|failed" test-output.txt | tail -40
            exit 1
          }
