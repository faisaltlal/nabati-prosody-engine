name: النشر على GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # خطوة يدوية لمرة واحدة قبل أول نشر ناجح:
      #   Settings ← Pages ← Build and deployment ← Source: GitHub Actions
      # توكن Actions لا يملك صلاحية إنشاء موقع Pages، فلا يمكن أتمتتها.
      - uses: actions/configure-pages@v5

      - name: رفع الموقع
        uses: actions/upload-pages-artifact@v3
        with:
          # ملفات ثابتة بلا خطوة بناء: الجذر كما هو.
          path: .

      - name: النشر
        id: deployment
        uses: actions/deploy-pages@v4
