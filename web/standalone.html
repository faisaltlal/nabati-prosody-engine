<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>محرك عروض الشعر النبطي — ملف واحد</title>
<meta name="description" content="وزن الشعر النبطي: البحر، التفعيلات، التقطيع، وموضع الكسر.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #faf8f5;
  --panel: #ffffff;
  --ink: #1d1a17;
  --muted: #6b625a;
  --line: #e6ded4;
  --brand: #8a5f43;
  --brand-soft: #f3e9e1;
  --good: #1f7a4d;
  --warn: #9a6b12;
  --bad: #a63232;
  --radius: 12px;
  --font: "Cairo", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #17140f;
    --panel: #211d18;
    --ink: #f0eae2;
    --muted: #a99d90;
    --line: #362f27;
    --brand: #d3a582;
    --brand-soft: #2e2620;
    --good: #5fc48c;
    --warn: #e0b04a;
    --bad: #ef7a7a;
  }
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  line-height: 1.7;
  -webkit-text-size-adjust: 100%;
}

.wrap { max-width: 960px; margin: 0 auto; padding: 10px 14px 48px; }

header { padding: 12px 0 8px; border-bottom: 1px solid var(--line); margin-bottom: 10px; }
header h1 { margin: 0; font-size: 1.15rem; font-weight: 700; }
header p { margin: 3px 0 0; color: var(--muted); font-size: .8rem; }

.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0; }
.tabs button {
  font: inherit; font-size: .88rem; padding: 7px 14px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--panel); color: var(--muted);
  cursor: pointer; -webkit-tap-highlight-color: transparent;
}
.tabs button[aria-selected="true"] { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 600; }

.panel {
  background: var(--panel); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 13px; margin-bottom: 11px;
}
.panel h2 { margin: 0 0 10px; font-size: .95rem; color: var(--muted); font-weight: 600; }

textarea, select, input {
  width: 100%; font: inherit; padding: 11px 12px;
  border: 1px solid var(--line); border-radius: 10px;
  background: var(--bg); color: var(--ink); resize: vertical;
}
textarea { min-height: 90px; font-size: 1.05rem; line-height: 2.1; }
textarea:focus, select:focus { outline: 2px solid var(--brand); outline-offset: 1px; }

.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
.row > * { flex: 0 0 auto; }
.grow { flex: 1 1 180px; }

button.go {
  font: inherit; font-weight: 600; padding: 10px 22px; border: 0; border-radius: 10px;
  background: var(--brand); color: #fff; cursor: pointer;
}
button.ghost {
  font: inherit; font-size: .85rem; padding: 7px 12px; border-radius: 8px;
  border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer;
}
label.check { display: inline-flex; align-items: center; gap: 6px; font-size: .85rem; color: var(--muted); }
label.check input { width: auto; }

.samples { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.samples button {
  font: inherit; font-size: .8rem; padding: 5px 11px; border-radius: 999px;
  border: 1px dashed var(--line); background: transparent; color: var(--muted); cursor: pointer;
}

.verdict { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.verdict .name { font-size: 1.5rem; font-weight: 700; }
.badge {
  font-size: .75rem; padding: 3px 10px; border-radius: 999px; font-weight: 600;
  background: var(--brand-soft); color: var(--brand);
}
.badge.sound { background: color-mix(in srgb, var(--good) 15%, transparent); color: var(--good); }
.badge.acceptable { background: color-mix(in srgb, var(--good) 12%, transparent); color: var(--good); }
.badge.broken { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.badge.unrecognized { background: color-mix(in srgb, var(--bad) 14%, transparent); color: var(--bad); }

.scores { display: flex; gap: 18px; margin-top: 10px; flex-wrap: wrap; }
.score-box { min-width: 96px; }
.score-box .n { font-size: 1.5rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.score-box .k { font-size: .75rem; color: var(--muted); }

.bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; margin-top: 6px; }
.bar > i { display: block; height: 100%; background: var(--brand); }

.note {
  font-size: .85rem; padding: 10px 12px; border-radius: 9px;
  background: var(--brand-soft); color: var(--ink); margin-top: 12px;
  border-inline-start: 3px solid var(--brand);
}
.note.warn { border-inline-start-color: var(--warn); }
.note strong { color: var(--brand); }

table { width: 100%; border-collapse: collapse; font-size: .85rem; }
th, td { text-align: start; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 600; font-size: .78rem; }
td.pat { font-family: var(--mono); direction: ltr; text-align: left; letter-spacing: .06em; }
tr.bad td { background: color-mix(in srgb, var(--bad) 7%, transparent); }

.scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }

.syls { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
.syl {
  border: 1px solid var(--line); border-radius: 7px; padding: 3px 8px;
  font-size: .8rem; background: var(--bg);
}
.syl.L { border-color: var(--brand); }
.syl.X { border-color: var(--warn); border-style: dashed; }
.syl small { color: var(--muted); font-size: .7rem; }

.mono {
  font-family: var(--mono); direction: ltr; text-align: left;
  font-size: .84rem; word-break: break-all; letter-spacing: .06em;
  background: var(--bg); padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line);
}
pre.mono { white-space: pre-wrap; line-height: 1.6; }

.alts { list-style: none; padding: 0; margin: 0; }
.alts li { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: .88rem; }
.alts li:last-child { border: 0; }
.alts .pctn { font-variant-numeric: tabular-nums; color: var(--muted); }

.muted { color: var(--muted); font-size: .85rem; }
.hidden { display: none !important; }
details { margin-top: 10px; }
summary { cursor: pointer; font-size: .85rem; color: var(--muted); }

footer { margin-top: 28px; padding-top: 14px; border-top: 1px solid var(--line); color: var(--muted); font-size: .8rem; }
footer code { font-family: var(--mono); font-size: .95em; }

</style>
<style>
/* ============================================================
   الكتابة اللحظية — حقلا الصدر والعجز، وبطاقات التفعيلات، والقافية.
   ملحق بـ style.css لا بديل عنه: بقية التبويبات تستعمله كما هو.
   ============================================================ */

/* ── الإدخال ──────────────────────────────────────────────── */
/* الارتفاع مقصود ضيّقًا: التفعيلات تتولّد أثناء الكتابة، فلا تنفع إن
   احتاج صاحبها إلى تمرير الصفحة ليراها. */
.panel.compact { padding: 10px 12px; margin-bottom: 10px; }

.mode {
  display: inline-flex; gap: 0; margin-bottom: 8px;
  border: 1px solid var(--line); border-radius: 999px; padding: 2px;
  background: var(--bg);
}
.mode button {
  font: inherit; font-size: .82rem; font-weight: 600;
  padding: 4px 18px; border: 0; border-radius: 999px;
  background: transparent; color: var(--muted); cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.mode button[aria-checked="true"] { background: var(--brand); color: #fff; }

.fields { display: grid; gap: 8px; grid-template-columns: 1fr; }

.field { display: block; }
.field-label {
  display: block; font-size: .72rem; font-weight: 600;
  color: var(--muted); margin-bottom: 3px;
}
/* سطر واحد يكفي ابتداءً، ويتّسع بالتمرير إن طال الشطر. */
.field textarea {
  min-height: 0; height: 44px; padding: 9px 11px;
  font-size: 1.05rem; line-height: 1.5; resize: none;
}

/* ── مربع الوزن ───────────────────────────────────────────── */
.verdict-panel { padding: 11px 13px; }
.verdict-panel .verdict .name { font-size: 1.25rem; }
.verdict-panel .score-line {
  display: flex; align-items: center; gap: 10px; margin-top: 8px;
}
.verdict-panel .bar { flex: 1 1 auto; margin-top: 0; }
.verdict-panel .pctn {
  font-variant-numeric: tabular-nums; font-weight: 700;
  font-size: 1.05rem; min-width: 3.2em; text-align: start;
}

.hemistich-head {
  display: flex; align-items: center; gap: 7px;
  flex-wrap: wrap; margin-bottom: 8px;
}
.hemistich-head:empty { display: none; }
.hemistich-head .field-label { margin: 0; }

.badge.soft { background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
.badge.writing {
  background: color-mix(in srgb, var(--brand) 12%, transparent);
  color: var(--brand);
}

/* ── شريط التفعيلات ───────────────────────────────────────── */
/* يمرّ أفقيًّا ولا يكسر الصفحة: البحور تبلغ ست عشرة تفعيلة. */
.feet {
  display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px;
  -webkit-overflow-scrolling: touch; scrollbar-width: thin;
}

.foot {
  flex: 0 0 auto; min-width: 92px; text-align: center;
  border: 1px solid var(--line); border-radius: 10px;
  padding: 9px 10px; background: var(--bg);
}
.foot-name { font-size: 1rem; font-weight: 700; line-height: 1.5; }
.foot-symbol {
  font-family: var(--mono); direction: ltr; font-size: .82rem;
  letter-spacing: .1em; color: var(--brand); margin-top: 2px;
  min-height: 1.2em;
}
.foot-text {
  font-size: .78rem; color: var(--muted); margin-top: 4px;
  max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.foot-state {
  font-size: .7rem; color: var(--muted); margin-top: 4px;
  padding-top: 4px; border-top: 1px solid var(--line);
}

.foot.salim { border-color: color-mix(in srgb, var(--good) 45%, var(--line)); }
.foot.salim .foot-state { color: var(--good); }

.foot.licensed { border-color: color-mix(in srgb, var(--warn) 50%, var(--line)); }
.foot.licensed .foot-state { color: var(--warn); }

.foot.broken {
  border-color: var(--bad);
  background: color-mix(in srgb, var(--bad) 7%, var(--bg));
}
.foot.broken .foot-state { color: var(--bad); font-weight: 600; }

/* التفعيلة الجارية: اسمها مقتطع بقدر ما كُتب منها. */
.foot.partial {
  border-color: var(--brand); border-style: dashed;
  background: var(--brand-soft);
}
.foot.partial .foot-state { color: var(--brand); }

/* ما لم يبلغه القلم بعد — يُرى ولا يُحاسَب. */
.foot.pending { opacity: .38; border-style: dashed; }

/* ── القافية ──────────────────────────────────────────────── */
.rhyme {
  margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line);
}
.rhyme-note { margin: 8px 0 0; font-size: .74rem; color: var(--muted); line-height: 1.6; }

/* ── الكتابة العروضية حرفًا حرفًا ──────────────────────────── */
.glyphs {
  display: flex; gap: 3px; overflow-x: auto; padding-bottom: 6px;
  margin-bottom: 12px; -webkit-overflow-scrolling: touch;
}
.glyph {
  flex: 0 0 auto; display: flex; flex-direction: column; align-items: center;
  min-width: 26px; border: 1px solid var(--line); border-radius: 7px;
  padding: 3px 4px; background: var(--bg);
}
.glyph b { font-weight: 600; font-size: .95rem; line-height: 1.4; }
.glyph i {
  font-style: normal; font-family: var(--mono); font-size: .78rem;
  color: var(--brand); line-height: 1.2;
}

/* ── سطر العلّة ───────────────────────────────────────────── */
.licence {
  display: block; margin-top: 10px; font-size: .8rem; line-height: 1.9;
  padding: 8px 11px; border-radius: 9px;
  background: color-mix(in srgb, var(--warn) 10%, transparent);
  color: var(--ink);
  border-inline-start: 3px solid var(--warn);
}

/* ── القافية: أسطر لا شبكة، كما يكتبها الوزّانون ──────────── */
.rhyme-line { font-size: .88rem; line-height: 2; }
.rhyme-line .rhyme-key {
  display: inline-block; min-width: 6.5em; color: var(--muted);
  font-size: .78rem; font-weight: 600;
}
.rhyme-span {
  font-weight: 700; background: var(--brand-soft);
  border-radius: 6px; padding: 1px 7px; margin-inline-start: 4px;
}

</style>

<div class="wrap">

<header>
  <h1>محرك عروض الشعر النبطي</h1>
  <p>اكتب، ويتولّد التقطيع حرفًا حرفًا.</p>
</header>

<nav class="tabs" role="tablist">
  <button role="tab" data-tab="analyze" aria-selected="true">أوزن البيت</button>

<!-- ============ أوزن البيت ============ -->
<section id="tab-analyze">
  <div class="panel compact">
    <!-- شطر أو بيت. الافتراضي شطر: أكثر ما يُكتب شطرٌ يُجرَّب وزنه. -->
    <div class="mode" role="radiogroup" aria-label="وضع الإدخال">
      <button type="button" role="radio" data-mode="single" aria-checked="true">شطر</button>
      <button type="button" role="radio" data-mode="pair" aria-checked="false">بيت</button>
    </div>

    <div class="fields" id="fields">
      <label class="field" id="field-single">
        <textarea id="single" rows="1" spellcheck="false" autocomplete="off"
          placeholder="اكتب شطرًا…"></textarea>
      </label>
      <label class="field hidden" id="field-sadr">
        <span class="field-label">الصدر</span>
        <textarea id="sadr" rows="1" spellcheck="false" autocomplete="off"
          placeholder="اكتب صدر البيت…"></textarea>
      </label>
      <label class="field hidden" id="field-ajz">
        <span class="field-label">العجز</span>
        <textarea id="ajz" rows="1" spellcheck="false" autocomplete="off"
          placeholder="اكتب عجز البيت…"></textarea>
      </label>
    </div>
  </div>

  <div id="result"></div>
</section>

<!-- ============ تدريب ============ -->
<section id="tab-train" class="hidden">
  <div class="panel">
    <h2>وضع التدريب</h2>
    <div class="row"><select id="trainMeter" class="grow"></select></div>
    <p class="muted" id="trainHint"></p>
    <textarea id="trainInput" spellcheck="false" placeholder="اكتب بيتك على هذا البحر…"></textarea>
    <div class="row"><button class="go" id="runTrain">تحقّق</button></div>
  </div>
  <div id="trainResult"></div>
</section>

<!-- ============ البحور ============ -->
<section id="tab-meters" class="hidden">
  <div class="panel">
    <h2>قاعدة الأوزان</h2>
    <div class="scroll"><table id="metersTable"></table></div>
  </div>
</section>

<footer>
  <p>المحرك يعمل كاملًا داخل متصفحك — لا خادم ولا شبكة ولا إرسال لأي نصّ.</p>
  <p>نسخة بملف واحد مكتفٍ بذاته (تعمل بلا إنترنت): <code>standalone.html</code></p>
</footer>

const ALEF_MADDA = 'آ'; // آ
const ALEF_HAMZA_ABOVE = 'أ'; // أ
const WAW_HAMZA = 'ؤ'; // ؤ
const ALEF_HAMZA_BELOW = 'إ'; // إ
const YEH_HAMZA = 'ئ'; // ئ
const ALEF = 'ا'; // ا

const ALEF_MAQSURA = 'ى'; // ى

const YEH = 'ي'; // ي

const NOON = 'ن'; // ن

const ALEF_WASLA = 'ٱ'; // ٱ

const DAMMATAN = 'ٌ'; // ٌ
const KASRATAN = 'ٍ'; // ٍ
const FATHA = 'َ'; // َ
const DAMMA = 'ُ'; // ُ
const KASRA = 'ِ'; // ِ
const SHADDA = 'ّ'; // ّ

]);

  return CONSONANT_LETTERS.has(ch);
}

function isDiacritic(ch) {
  return DIACRITICS.has(ch);
}

function isSunLetter(ch) {
  return SUN_LETTERS.has(ch);

    case FATHA:

    case DAMMA:

    case KASRA:
    case KASRATAN:

    default:

 * يجعل إضافة بحر تعديلًا في البيانات لا في الكود.
 *
 * للبحر صيغتان: **الصدر** و**العجز**. والعجز في هذه القاعدة هو الصدر
 * نفسه مع تذييل في آخر تفعيلة (فاعلاتن ← فاعلاتان). بعض البحور صيغة
 * واحدة، إما لأن المصدر سوّى بين شطريها وإما لأنه أعطى سطرًا واحدًا.
 */

const { DIACRITICS } = __M;

function buildRegistry({ tafaeel, variations, meters }) {
  const tafilaById = new Map(tafaeel.tafaeel.map((t) => [t.id, t]));
  const problems = [];

  /** الصور المسموحة لتفعيلة، مع صورتها السالمة أولًا. */
  function variantsOf(tafilaId) {
    const list = variations.variations[tafilaId];
    if (!list) {
      problems.push({ kind: 'missing_variations', tafilaId });
      const t = tafilaById.get(tafilaId);
      return t ? [{ id: 'salim', name: 'سالم', result: t.vocalized, syllables: t.syllables, kind: 'salim', scope: 'any', severity: 1 }] : [];
    }
    return list;
  }

  function buildForm(meterId, form) {
    const feet = [];
    const pattern = [];
    const names = [];
    form.feet.forEach((fid, i) => {
      const t = tafilaById.get(fid);
      if (!t) {
        problems.push({ kind: 'unknown_tafila', meter: meterId, tafilaId: fid });
        return;
      }
      feet.push({
        index: i,
        tafilaId: t.id,
        plain: t.plain,
        vocalized: t.vocalized,
        salim: t.syllables,
        variants: variantsOf(t.id),
      });
      pattern.push(...t.syllables);
      names.push(t.plain);
    });
    return {
      role: form.role,
      sourceQuote: form.sourceQuote,
      feet,
      pattern,
      tafaeelNames: names,
    };
  }

  const built = [];
  for (const m of meters.meters) {
    const forms = (m.forms || []).map((f) => buildForm(m.id, f));
    const sadr = forms[0];

    const entry = {
      id: m.id,
      name: m.name,
      aliases: m.aliases || [],
      enabled: m.enabled !== false && forms.length > 0 && sadr.pattern.length > 0,
      status: m.status,
      note: m.note,
      validation: m.validation,
      sourceIndex: m.sourceIndex,
      forms,
      // الصدر هو الصيغة المرجعية: النمط والطول والتفعيلات المعروضة منه.
      feet: sadr ? sadr.feet : [],
      pattern: sadr ? sadr.pattern : [],
      tafaeelNames: sadr ? sadr.tafaeelNames : [],
      sourceQuote: forms.map((f) => f.sourceQuote).filter(Boolean).join('  /  '),
    };

    if (m.expectedSyllableCount != null && entry.pattern.length !== m.expectedSyllableCount) {
      problems.push({
        kind: 'syllable_count_mismatch',
        meter: m.id,
        declared: m.expectedSyllableCount,
        derived: entry.pattern.length,
      });
    }

    built.push(entry);
  }

  // تحقّق: النمط المقطعي لكل تفعيلة يوافق نمطها الحرفي الخليلي.
  for (const t of tafaeel.tafaeel) {
    const derived = lettersFromSyllables(t.syllables);
    if (t.khalilLetters && derived !== t.khalilLetters) {
      problems.push({
        kind: 'tafila_pattern_mismatch',
        tafilaId: t.id,
        fromSyllables: derived,
        declared: t.khalilLetters,
      });
    }
  }

  const byId = new Map(built.map((m) => [m.id, m]));

  return {
    meters: built,
    enabled: built.filter((m) => m.enabled),
    byId,
    tafilaById,
    problems,
    notInSource: meters.notInSource || [],

    find(nameOrId) {
      if (byId.has(nameOrId)) return byId.get(nameOrId);
      const needle = String(nameOrId).trim();
      return built.find((m) => m.name === needle || m.aliases.includes(needle)) || null;
    },
  };
}

/**
 * من المقاطع إلى الحروف الخليلية (1 متحرك / 0 ساكن).
 * قصير = متحرك. طويل = متحرك فساكن. مفرط = متحرك فساكنان.

    .map((s) => (s === 'S' ? '1' : s === 'X' ? '100' : '10'))
    .join('');

/**
 * اسم التفعيلة وقد كُتب بعضُها — «مستف» لمن بلغ مقطعين من «مستفعلن».
 *
 * لا يُقتطع الاسم بالتخمين: عدد حروف كل مقطع مشتقّ من `lettersFromSyllables`
 * نفسها التي يشتقّ منها الترميز الحرفي، واختبارٌ يشترط تطابقها مع
 * `khalilLetters` المصرَّح به لكل تفعيلة. فلو اختلّ الاشتقاق ظهر فشلًا
 * لا اسمًا مقطوعًا خطأً.
 *
 * @param {string} vocalized صورة التفعيلة المشكولة (سالمةً كانت أو مزاحَفة)

 * @param {number} filled كم مقطعًا منها تحقّق

  const plain = [...String(vocalized)].filter((c) => !DIACRITICS.has(c));
  if (filled >= syllables.length) return plain.join('');
  const letters = lettersFromSyllables(syllables.slice(0, filled)).length;
  return plain.slice(0, letters).join('');
}

  Object.assign(__M, { buildRegistry, lettersFromSyllables, partialTafilaName });
}

{
/**
 * Scoring Engine — معادلة الدرجة، معزولة عمدًا.
 *
 * لا يوجد في هذا الملف رقم مكتوب: كل المعاملات تأتي من data/scoring.json.
 * تعديل الترتيب يتم بتحرير ذلك الملف وحده، دون إعادة بناء المحرك.
 *
 * المعادلة كاملةً في docs/SCORING.md. ملخّصها:
 *
 *   التكلفة = Σ (كلفة صورة التفعيلة + كلفة محاذاة مقاطعها) × معامل الموضع
 *           + كلفة المقاطع الفائضة + كلفة التفعيلات الخاوية
 *
 *   الدرجة = 1 − التكلفة ÷ (عدد مقاطع البحر × كلفة المقطع الواحد)
 *
 * الدرجة حتمية: النصّ نفسه والبيانات نفسها تعطيان الرقم نفسه دائمًا.
 */

function createScorer(config) {
  const w = config.weights;

  /** كلفة وضع مقطع مكان مقطع. */
  function substitutionCost(actual, expected) {
    if (actual === expected) return 0;
    // الطويل والمفرط في آخر الشطر فرق تدوين أكثر منه فرق سمع.
    const pair = [actual, expected].sort().join('');
    if (pair === 'LX') return w.overlongMismatch;
    return w.substitution;
  }

  /** كلفة استعمال صورة مزاحَفة أو معلولة بدل السالمة. */
  function variationCost(variant, { isArudDarb }) {
    const base = w.variationKind[variant.kind] ?? w.variationKind.zihaf;
    const sev = w.severityMultiplier[String(variant.severity ?? 1)] ?? 1;
    let cost = base * sev;
    // العلة لا تقع إلا في العروض والضرب؛ وقوعها في الحشو مخالفة تُحاسَب.
    if (variant.scope === 'arud_darb' && !isArudDarb) cost += w.scopeViolation;
    return cost;
  }

  function positionMultiplier({ isFirst, isArudDarb }) {
    if (isArudDarb) return w.position.arudDarb;
    if (isFirst) return w.position.first;
    return w.position.hashw;
  }

  const weights = {
    substitution: w.substitution,
    insertion: w.insertion,
    deletion: w.deletion,
    overlongMismatch: w.overlongMismatch,
    unconsumedSyllable: w.unconsumedSyllable,
    unfilledFoot: w.unfilledFoot,
    inconsistentWordReading: w.inconsistentWordReading ?? 0,
  };

  /** يحوّل التكلفة الخام إلى درجة في [0,1]. */
  function finalize(totalCost, meterSyllableCount, { assumedVocalization } = {}) {
    const n = Math.max(meterSyllableCount, config.normalizer.floor);
    const normalizer = n * config.normalizer.perSyllableCost;
    let score = 1 - totalCost / normalizer;
    score = Math.max(0, Math.min(1, score));

    let confidence = score;
    if (assumedVocalization) {
      confidence *= 1 - config.uncertainty.assumedVocalizationPenalty;
    }
    return {
      score: round(score),
      confidence: round(confidence),
      cost: round(totalCost),
      normalizer: round(normalizer),
    };
  }

  /**
   * الحالات A/B/C/D من البند 15 من المواصفة.
   *
   * الدرجة وحدها لا تكفي: بيت اختلّت كل تفعيلاته بمقطع واحد لكلٍّ منها
   * ينال درجة متوسطة، فيُقال عنه «قريب من البحر» وهو ليس كذلك — القرب
   * من وزن معناه أن أكثره صحيح. لذلك نسبة التفعيلات المختلّة تردّ الحكم
   * وإن لم تردّه الدرجة.
   */
  function classify(score, { brokenFeet = 0, totalFeet = 0 } = {}) {
    const t = config.thresholds;
    if (totalFeet > 0 && brokenFeet / totalFeet > t.maxBrokenFootRatio) {
      return 'unrecognized';
    }
    // تفعيلة لم توافق أي صورة مأذون فيها هي كسر بالتعريف، مهما ارتفعت
    // الدرجة. الزحاف والعلة لا يقعان هنا: كلفتهما في variationCost لا في
    // كلفة المحاذاة، فالبيت المزاحَف يبقى «موزونًا برخصة» لا مكسورًا.
    const byScore =
      score >= t.sound ? 'sound'
      : score >= t.acceptable ? 'acceptable'
      : score >= t.broken ? 'broken'
      : 'unrecognized';
    if (brokenFeet > 0 && (byScore === 'sound' || byScore === 'acceptable')) {
      return 'broken';
    }
    return byScore;
  }

  return {
    substitutionCost,
    variationCost,
    positionMultiplier,
    finalize,
    classify,
    weights,
    thresholds: config.thresholds,
    ranking: config.ranking,
    brokenFootThreshold: config.brokenFoot.minCostToReport,
    config,
  };
}

function round(x) {
  return Math.round(x * 1e6) / 1e6;
}

  Object.assign(__M, { createScorer });
}

{
/**
 * DigitalPattern — تحويل التمثيل الداخلي إلى ترميز رقمي معروض.
 *
 * البند 10 من المواصفة: «لا تفترض معنى الرقم من عندك… لا تضع
 * hard-coded conversion غير مثبت». لذلك لا يوجد في هذا الملف رقم واحد
 * مكتوب: كل الترميزات تُقرأ من data/encodings.json، والمحرك كله يشتغل
 * على الحروف S/L/X لا على الأرقام.
 *
 * التحويل هنا طبقة عرض فقط. تغيير ترميز الأرقام لا يمسّ المطابقة ولا
 * الدرجة إطلاقًا.
 */

/** المستوى المقطعي: رمز لكل مقطع. */
function encodeSyllables(syllables, scheme) {
  return syllables
    .map((s) => scheme.map[typeof s === 'string' ? s : s.weight] ?? '?')
    .join(scheme.separator ?? '');
}

/**
 * المستوى الحرفي الخليلي: متحرك/ساكن لكل حرف.
 * يُشتق من شكل المقطع لا من النصّ، فيبقى مستقلًا عن الرسم:
 *   CV = متحرك            → 1
 *   CVV = متحرك + ساكن    → 10   (حرف المدّ ساكن)
 *   CVC = متحرك + ساكن    → 10
 *   CVVC = متحرك + ساكنان → 100
 */
function encodeLetters(syllables, scheme) {
  const moving = scheme.map.moving;
  const still = scheme.map.still;
  return syllables
    .map((s) => {
      const shape = typeof s === 'string' ? shapeFromWeight(s) : s.shape || shapeFromWeight(s.weight);
      switch (shape) {
        case 'CV': return moving;
        case 'CVV':
        case 'CVC': return moving + still;
        case 'CVVC':
        case 'CVCC': return moving + still + still;
        default: return moving;
      }
    })
    .join(scheme.separator ?? '');

function shapeFromWeight(w) {
  if (w === 'S') return 'CV';
  if (w === 'X') return 'CVVC';
  return 'CVC';
}

function createEncoder(encodings) {
  const byId = new Map(encodings.schemes.map((s) => [s.id, s]));

  /**
   * @param {Array} syllables  مقاطع أو حروف S/L/X
   * @param {string} [schemeId]
   */
  function encode(syllables, schemeId = encodings.defaultScheme) {
    const scheme = byId.get(schemeId);
    if (!scheme) throw new Error(`ترميز غير معروف: ${schemeId}`);
    if (scheme.enabled === false || !scheme.map) {
      return {
        schemeId,
        status: scheme.status,
        value: null,
        note: scheme.note,
        resolvedBy: scheme.resolvedBy,
      };
    }
    const value = scheme.level === 'letter'
      ? encodeLetters(syllables, scheme)
      : encodeSyllables(syllables, scheme);
    return { schemeId, status: scheme.status, level: scheme.level, value, note: scheme.note };
  }

  /** كل الترميزات المتاحة دفعةً واحدة — مفيد للتحقق المتقاطع في وضع التتبّع. */
  function encodeAll(syllables) {
    const out = {};
    for (const s of encodings.schemes) out[s.id] = encode(syllables, s.id);
    return out;
  }

  return { encode, encodeAll, schemes: encodings.schemes, internal: encodings.internal };
}

  Object.assign(__M, { createEncoder });
}

{
/**
 * TextNormalizer — طبقة التطبيع.
 *
 * قاعدة حاكمة: لا يُحذف شيء يؤثر في النطق. كل ما يُحذف يُسجَّل في
 * `removed` حتى يكون القرار مرئيًا في وضع التتبّع.
 *
 * ما لا يفعله هذا الملف عمدًا:
 *  - لا يوحّد صور الهمزة (أ إ آ ؤ ئ) بألف مجرّدة: الهمزة صامت، وحذفها
 *    يغيّر عدد الأصوات ومن ثمّ الوزن. توحيد صور الهمزة يقع في طبقة
 *    الأصوات حيث تُردّ كلها إلى الصامت نفسه دون فقد.
 *  - لا يحذف التشكيل: الحركات هي المعلومة التي يقوم عليها التقطيع كله.
 */

const { TATWEEL, QURANIC_MARKS, NON_ARABIC, ALEF_WASLA, ALEF, ALEF_MAQSURA, YEH, isDiacritic } = __M;

/** فواصل الشطرين المعروفة في تدوين الشعر. */
const HEMISTICH_SEPARATORS = /\s*(?:\.{3,}|…|\*+|\|{1,2}|-{2,}|\t| {2,})\s*/;

const PUNCTUATION = /[.,;:!?"'«»()\[\]{}—–،؛؟]/g;

/**
 * @param {string} raw
 * @param {{ unifyYehMaqsura?: boolean }} [options]
 * @returns {{
 *   text: string, words: {text:string, index:number}[],
 *   removed: {what:string, why:string, count:number}[],
 *   hasDiacritics: boolean, vocalizationCoverage: number
 * }}
 */
function normalize(raw, options = {}) {
  const removed = [];
  const note = (what, why, count) => {
    if (count > 0) removed.push({ what, why, count });
  };

  let text = String(raw ?? '');

  // 1) تطبيع Unicode: يفكّك الصور المركّبة فتصبح الحركات قابلة للفحص.
  text = text.normalize('NFC');

  // 2) التطويل — زخرفة خطية بحتة.
  const tatweelCount = (text.match(new RegExp(TATWEEL, 'g')) || []).length;
  text = text.split(TATWEEL).join('');
  note('التطويل', 'زخرفة خطية لا صوت لها', tatweelCount);

  // 3) العلامات القرآنية وعلامات الوقف.
  const quranic = (text.match(QURANIC_MARKS) || []).length;
  text = text.replace(QURANIC_MARKS, '');
  note('علامات الضبط القرآني', 'علامات تجويد لا تغيّر الكمّية الصوتية', quranic);

  // 4) الترقيم — يُبدَّل بفراغ لئلا تلتصق كلمتان فيُقرآ كلمة واحدة.
  const punct = (text.match(PUNCTUATION) || []).length;
  text = text.replace(PUNCTUATION, ' ');
  note('الترقيم', 'لا أثر له في الوزن، وأُبدل بفراغ حفاظًا على حدود الكلمات', punct);

  // 5) ألف الوصل ٱ ← ا. الصورتان صوت واحد؛ خبر الوصل يُستنتج من السياق
  //    في طبقة الأصوات لا من الرسم.
  const wasla = (text.match(new RegExp(ALEF_WASLA, 'g')) || []).length;
  text = text.split(ALEF_WASLA).join(ALEF);
  note('ألف الوصل ٱ', 'وُحِّدت بالألف؛ حكم الوصل يُشتق من الموضع', wasla);

  // 6) توحيد الياء والألف المقصورة — اختياري وغير مفعَّل افتراضيًا.
  //    السبب: التوحيد محايد عروضيًا أصلًا. ى تُنطق ألفًا طويلة، وي في
  //    آخر الكلمة إما ياء مدّ طويلة وإما صامت؛ والطويل طويل في الحالين،
  //    فكمّية المقطع لا تتغيّر. تركناه اختياريًا لئلا نفقد معلومة بلا مقابل.
  if (options.unifyYehMaqsura) {
    const c = (text.match(new RegExp(ALEF_MAQSURA + '$|' + ALEF_MAQSURA + '(?=\\s)', 'g')) || []).length;
    text = text.replace(new RegExp(ALEF_MAQSURA, 'g'), YEH);
    note('الألف المقصورة', 'وُحِّدت بالياء بطلب صريح — محايد عروضيًا', c);
  }

  const foreign = (text.match(NON_ARABIC) || []).length;
  text = text.replace(NON_ARABIC, ' ');
  note('رموز غير عربية', 'لا تمثّل أصواتًا عربية', foreign);

  // 8) ضغط الفراغات.
  text = text.replace(/\s+/g, ' ').trim();

  const words = text.length
    ? text.split(' ').map((w, i) => ({ text: w, index: i }))
    : [];

  const letters = [...text].filter((c) => !isDiacritic(c) && c !== ' ');
  const marks = [...text].filter((c) => isDiacritic(c));
  const coverage = letters.length ? marks.length / letters.length : 0;

  return {
    text,
    words,
    removed,
    hasDiacritics: marks.length > 0,
    vocalizationCoverage: Number(coverage.toFixed(3)),
  };
}

/**
 * يقسم المُدخل إلى أشطر إن وُجد فاصل صريح.
 * لا يخمّن موضع القسمة عند غياب الفاصل — التخمين هناك يقع في المطابق
 * حيث يمكن الحكم عليه بالوزن لا بالحدس.
 */
function splitHemistichs(raw) {
  const parts = String(raw ?? '')
    .split(HEMISTICH_SEPARATORS)
    .map((p) => p.trim())
    .filter(Boolean);
  return { parts, explicit: parts.length > 1 };
}

/** يقسم قصيدة إلى أبيات على الأسطر. */
function splitLines(raw) {
  return String(raw ?? '')
    .split(/\r?\n/)
    .map((l) => l.trim())
    .filter(Boolean);
}

  Object.assign(__M, { normalize, splitHemistichs, splitLines });
}

 *
 * المخرَج «وحدات» (Units). الوحدة = صامت واحد + وصف الحركة التي تليه.
 * اخترنا هذا التمثيل لأن كل مقطع عربي يبدأ بصامت واحد بلا استثناء،

 * قابلًا للحساب بلا حالات خاصة.
 *
 * وصف الحركة:
 *   { known: true,  length: 'none'|'short'|'long', quality: 'a'|'i'|'u'|null }
 *   { known: false, options: ['none','short'] | ['none','short','long'] }
 *
 * `known:false` هو موضع الغموض كله: نصّ غير مشكول لا يُعرف فيه أمتحرّك
 * الحرف أم ساكن. لا نخمّن هنا — نترك الاحتمالات مفتوحة ويحسمها المطابق
 * بالوزن، فيبقى القرار قابلًا لإعادة الإنتاج والتفسير.

 * والصموت، ولا يُحسم إلا بحركة ما قبلهما.

    i === letters.length - 1 &&

 * @param {{text:string,index:number}[]} words

 * @param {{ pausalEnd?: boolean }} [options]

  const trace = [];

  const knownVocalizations = lexicon.knownVocalizations?.words || {};

  const tafilaNames = lexicon.tafilaVocalizations || {};

      .filter((r) => r.action === 'drop_final_waw')

      // من التشكيل أصلًا — تشكيل الشاعر أولى من الجدول دائمًا.
      log('knownVocalization', `${bare} ← ${knownVocalizations[bare]}`);
      surface = knownVocalizations[bare];
    } else if (surface === bare && tafilaNames[bare]) {
      // اسم تفعيلة كُتب مجرّدًا: نطقه مقرَّر في البيانات نفسها.
      log('tafilaName', `${bare} ← ${tafilaNames[bare]}`);
      surface = tafilaNames[bare];

    // محايد عروضيًا — القراءتان تعطيان الكمّيات نفسها — فالخطأ هنا
    // لا يُفسد الوزن. انظر docs/PROSODY.md

      letters.length >= 3 &&
      letters[0].ch === ALEF &&
      !letters[0].marks.includes(SHADDA) &&
      letters[1].ch === LAM &&
      !hasOwnVowel(letters[1]);

      const target = letters[2];
      if (atLineStart) {
        // همزة وصل مبتدأ بها: تُنطق همزةً مفتوحة.
        push({ c: HAMZA, vowel: KNOWN('short', 'a'), word: w, wordInitial: true, source: 'hamzat_wasl' });

      } else {
        log('hamzatWasl', 'أل موصولة بما قبلها — الهمزة ساقطة');
      }

          continue;
        }

        // المدّ يقتضي متحركًا قبله، فالألف بعد الساكن لا تكون مدًّا
        // البتّة — وإنما هي همزة قطع كُتبت بلا رأسها: «الاطلال»
        // موضعها «الأطلال»، والرسم النبطي يُغفل الهمزة كثيرًا.

        // وكانت تسقط هنا سقوطًا صامتًا: لا مدًّا تُلحق ولا همزةً

          push({
            c: HAMZA,
            vowel: v.kind === 'short' ? KNOWN('short', v.quality) : UNKNOWN(['short']),
            word: w,
            source: 'hamzat_qat_bare',
            // في النطق المتصل — وهو الغالب في النبطي — تسقط هذه الهمزة
            // وتنتقل حركتها إلى الساكن قبلها: «غطّ الاطلال» تُنطق
            // «غَطْ‑طَ‑لَطْ‑لَالْ». والقراءتان مشروعتان، فتُعرضان معًا

          // معروضتان على الوزن وهو الذي يحسم.

          c: HAMZA,
          vowel: v.kind === 'short' ? KNOWN('short', v.quality) : UNKNOWN(['none', 'short']),

          wordInitial: true,
          source: 'hamzat_qat',

        vowel = KNOWN('long', 'a');
        push({ c: consonant, vowel, word: w, wordInitial: i === 0, letter: L.ch });
        continue;

        // تاء عند الوصل، هاء عند الوقف.
        consonant = atPause ? HEH : TEH;
        log('taMarbuta', atPause ? 'وقف — تُنطق هاءً' : 'وصل — تُنطق تاءً');
      }

      if (marks.includes(SHADDA) && !geminationEmitted) {
        // المشدّد صوتان: الأول ساكن يغلق ما قبله، والثاني متحرك.
        push({ c: consonant, vowel: KNOWN('none', null), word: w, source: 'shadda' });
        log('shadda', `${L.ch} مشدّد — ساكن ثم متحرك`);
      }
      geminationEmitted = false;

      // ---- الحركة ----
      if (v.kind === 'short' || v.kind === 'tanween') {
        vowel = KNOWN('short', v.quality);
      } else if (v.kind === 'sukun') {
        vowel = KNOWN('none', null);
      } else if (v.kind === 'long') {
        vowel = KNOWN('long', 'a'); // ألف خنجرية
      } else if (L.ch === ALEF_HAMZA_BELOW) {
        vowel = KNOWN('short', 'i'); // إ تحمل الكسر بحكم الرسم
      } else {
        vowel = UNKNOWN(['none', 'short']);

      // ---- المدّ: هل الحرف التالي حرف مدّ لهذا الصامت؟ ----

      if (next && !HAMZA_FORMS.has(next.ch) && vowel.length !== 'none') {

        const nextIsSilentAlef = isSilentAlefOfJamaa(letters, i + 1);
        if (q && !hasOwnVowel(next) && !nextIsSilentAlef) {
          if (next.ch === ALEF || next.ch === ALEF_MAQSURA) {
            // الألف لا تكون إلا مدًّا — لا احتمال آخر.
            vowel = KNOWN('long', 'a');
            i++; // استُهلك حرف المدّ

            if (vowel.quality === q) {

            // يغلق المقطع، فتُترك لتُعالَج وحدةً مستقلة.
          } else if (!vowel.known) {
            // غير مشكول: يحتمل المدّ ويحتمل الصموت. نفتح البابين
            // ونترك الحسم للمطابقة بالوزن.
            vowel = UNKNOWN(['none', 'short', 'long']);
            vowel.longQuality = q;
            suppressNextIfLong = true;

      push({
        c: consonant,
        vowel,
        word: w,
        wordInitial: i === 0,
        wordFinal: isLastLetter,
        atPause,
        suppressNextIfLong,
        letter: L.ch,
      });

      if (v.kind === 'tanween') {
        // التنوين نون ساكنة في النطق: كتابٌ = كتابن.
        push({ c: NOON, vowel: KNOWN('none', null), word: w, source: 'tanween' });
        log('tanween', 'التنوين نون ساكنة');
      }
    }
  }

  // آخر وحدة في الشطر: لا يقع بعدها إعراب، فاحتمال «متحرك» يبقى
  // قائمًا لأجل الإشباع، ويتكفّل به بناء المقاطع.
  if (units.length) units[units.length - 1].isFinal = true;

  return { units, trace };

 * يُرخي السكونات التي كتبها الشاعر بيده، فتصير حركتها مجهولة.

 * لا يُستعمل إلا حين يعجز التشكيل المكتوب عن أن يُقرأ أصلًا: «ذكْرْتك»

function runAlignment(dag, from, pattern, scorer) {

 *  - نعرف **أي تفعيلة** اختلّت وبأي مقطع، لا مجرد أن البيت مكسور.
 *  - إضافة بحر أو صورة جديدة لا تمسّ هذا الملف إطلاقًا.
 */

const { matchFoot, minSyllablesToEnd, createAlignmentCache } = __M;
const { inconsistentWordReadings } = __M;

/**
 * @param {object} dag مخطّط مقاطع الشطر
 * @param {object} meter من السجلّ
 * @param {object} scorer
 * @param {{ repeat?: number }} [options] عدد الأشطر المطلوب مطابقتها بالنمط
 */
function matchMeter(dag, meter, scorer, options = {}) {
  const repeat = options.repeat || 1;
  // forms[i] = صيغة الشطر i. الصدر والعجز صورتان للبحر نفسه لا بحران،
  // فلكل شطر أن يأتي على أيّهما.
  const forms = options.forms
    || Array.from({ length: repeat }, () => options.form || 0);
  const feet = expandFeet(meter, forms);
  if (!feet.length) return null;
  const tailCost = minSyllablesToEnd(dag);

  // states: Map<unitIndex, {cost, chosen[]}>
  let states = new Map([[0, { cost: 0, chosen: [] }]]);

  for (let f = 0; f < feet.length; f++) {
    const foot = feet[f];
    const next = new Map();
    const posCtx = { isFirst: foot.isFirst, isArudDarb: foot.isArudDarb };
    const posMult = scorer.positionMultiplier(posCtx);

    for (const [u, state] of states) {
      for (const variant of foot.variants) {
        const vCost = scorer.variationCost(variant, posCtx);
        const ends = matchFoot(dag, u, variant.syllables, scorer, options.cache);
        for (const [end, res] of ends) {
          let cost = state.cost + (vCost + res.cost) * posMult;
          if (end === u) cost += scorer.weights.unfilledFoot;

          const prev = next.get(end);
          if (prev !== undefined && prev.cost <= cost + 1e-12) continue;

          next.set(end, {
            cost,
            chosen: [
              ...state.chosen,
              {
                footIndex: f,
                hemistich: foot.hemistich,
                tafila: foot.plain,
                tafilaId: foot.tafilaId,
                variant: { id: variant.id, name: variant.name, result: variant.result, kind: variant.kind },
                expected: variant.syllables,
                actual: res.syllables.map((e) => e.weight),
                unitSpan: [u, end],
                alignCost: res.cost,
                variationCost: vCost,
                positionMultiplier: posMult,
                totalCost: (vCost + res.cost) * posMult,
                ops: res.ops,
                empty: end === u,
              },
            ],
          });
        }
      }
    }
    states = next;
    if (states.size === 0) break;
  }

  // إغلاق: ما بقي من وحدات بعد آخر تفعيلة يُحاسَب بعدد المقاطع اللازمة له.
  let best = null;
  for (const [u, state] of states) {
    const leftover = tailCost[u];
    if (!Number.isFinite(leftover)) continue; // مسار لا يستهلك بقية البيت
    const total = state.cost + leftover * scorer.weights.unconsumedSyllable;
    if (!best || total < best.total - 1e-12) {
      best = { total, state, endUnit: u, leftoverSyllables: leftover };
    }
  }

  if (!best) {
    return {
      meterId: meter.id,
      name: meter.name,
      repeat,
      matched: false,
      reason: 'لا يوجد تقطيع صالح لهذا البيت يوافق بنية هذا البحر',
      score: 0,
      confidence: 0,
    };
  }

  const meterSyllables = feet.reduce(
    (n, f) => n + (f.salim ? f.salim.length : 0), 0
  ) || meter.pattern.length * repeat;

  // الكلمة الواحدة لا تُنطق في الشطر الواحد نطقين. والنصّ غير المشكول
  // يتعادل عليه بحور كثيرة تعادلًا تامًّا، فيصير اتّساق القراءة هو
  // الفارق الحقيقي بينها — لا ترتيب القائمة.
  const oddReadings = inconsistentWordReadings(best.state.chosen, options.units, options.words);
  const total = best.total + oddReadings * scorer.weights.inconsistentWordReading;

  const { score, confidence, cost, normalizer } = scorer.finalize(
    total,
    meterSyllables,
    { assumedVocalization: dag.assumedVocalization }
  );

  const chosen = best.state.chosen;
  const brokenFeet = chosen
    .filter((c) => c.alignCost >= scorer.brokenFootThreshold || c.empty)
    .map((c) => ({
      footIndex: c.footIndex,
      hemistich: c.hemistich,
      tafila: c.tafila,
      expected: c.expected.join(''),
      actual: c.actual.join('') || '—',
      cost: round(c.alignCost),
      issues: describeOps(c.ops),
    }));

  return {
    meterId: meter.id,
    name: meter.name,
    aliases: meter.aliases,
    status: meter.status,
    repeat,
    forms,
    formRole: feet[0] && feet[0].formRole,
    // صيغة كل شطر على حدة ومرتَّبة، لا مجموعةً مبهمة: البيت قد يأتي
    // صدرًا ثم عجزًا، وقد يأتي شطراه على الصيغة نفسها.
    formRoles: forms.map((i) => {
      const available = meter.forms && meter.forms.length ? meter.forms : [];
      const f = available[Math.min(i, available.length - 1)];
      return (f && f.role) || null;
    }),
    matched: true,
    score,
    confidence,
    cost,
    normalizer,
    verdict: scorer.classify(score, { brokenFeet: brokenFeet.length, totalFeet: chosen.length }),
    feet: chosen,
    matchedPattern: chosen.flatMap((c) => c.expected).join(''),
    actualPattern: chosen.flatMap((c) => c.actual).join(''),
    brokenFeet,
    leftoverSyllables: best.leftoverSyllables,
    // كلمات قُرئت خلافًا لمثيلاتها — تُعلَن ولا تُطوى.
    inconsistentWordReadings: oddReadings,
    assumedVocalization: dag.assumedVocalization,
  };
}

/**
 * يبسط تفعيلات البحر على الأشطر المطلوبة.
 *
 * الصدر والعجز صورتان للبحر الواحد لا بحران، والعجز هو الصدر مع تذييل.
 * فيختار كل شطر صيغته باستقلال: شطر واحد قد يأتي على أيّهما، والبيت
 * الكامل قد يأتي شطراه على صيغتين مختلفتين أو على واحدة.
 */
function expandFeet(meter, forms) {
  const available = meter.forms && meter.forms.length
    ? meter.forms
    : [{ feet: meter.feet }];
  const out = [];
  forms.forEach((formIndex, r) => {
    const form = available[Math.min(formIndex, available.length - 1)];
    form.feet.forEach((foot, i) => {
      out.push({
        ...foot,
        hemistich: r,
        formRole: form.role,
        isFirst: i === 0,
        // آخر تفعيلة في كل شطر هي العروض أو الضرب، وفيهما وحدهما تجوز العلل.
        isArudDarb: i === form.feet.length - 1,
      });
    });
  });
  return out;
}

function describeOps(ops) {
  const issues = [];
  let pos = 0;
  for (const o of ops) {
    if (o.op === 'match') { pos++; continue; }
    if (o.op === 'substitute') {
      issues.push({
        position: pos,
        kind: 'substitute',
        text: `المقطع ${pos + 1}: البحر يطلب ${o.expected} والبيت أعطى ${o.edge.weight}`,
      });
      pos++;
    } else if (o.op === 'insert') {
      issues.push({
        position: pos,
        kind: 'insert',
        text: `مقطع ${o.edge.weight} زائد لا موضع له في التفعيلة`,
      });
    } else if (o.op === 'delete') {
      issues.push({
        position: pos,
        kind: 'delete',
        text: `المقطع ${pos + 1}: البحر يطلب ${o.expected} ولا مقابل له في البيت`,
      });
      pos++;
    }
  }
  return issues;
}

/**
 * يطابق البيت على كل بحر مفعَّل ويرجع ترتيبًا لا إجابة واحدة (البند 12).
 */
function rankMeters(dag, registry, scorer, options = {}) {
  const repeats = options.repeats || [1];
  const results = [];
  // ذاكرة واحدة لكل ترتيب: التفعيلة الواحدة تتكرّر في عشرات البحور،
  // فتُحاذى مرّة وتُقرأ مرارًا. و`cache: false` تُعطّلها — يحتاجها
  // اختبارٌ يقارن النتيجتين ليثبت أنها تسريع لا تغيير.
  const cache = options.cache === false ? null : (options.cache || createAlignmentCache());

  for (const meter of registry.enabled) {
    let bestForMeter = null;
    const formCount = meter.forms ? meter.forms.length : 1;
    for (const repeat of repeats) {
      for (const forms of formCombinations(formCount, repeat)) {
        const r = matchMeter(dag, meter, scorer, { repeat, forms, cache: cache || false, units: options.units, words: options.words });
        if (!r || !r.matched) continue;
        if (!bestForMeter || betterForm(r, bestForMeter, options.preferRole)) bestForMeter = r;
      }
    }
    if (bestForMeter) results.push(bestForMeter);
  }

  // عند تساوي الدرجة يُقدَّم الأسبق في قائمة المصدر.
  //
  // كان الترجيح بترتيب المعرّف أبجديًّا، وهو لا يدلّ على شيء: يُقدّم
  // `al_baseet_1` على `al_maskhub` لأن الباء قبل الميم لا غير. وترتيب
  // القائمة دلالةٌ حقيقية — صاحبها قدّم المسحوب على سائر البحور —
  // فاتّباعه أولى من اتّباع الهجاء.
  //
  // ولا يُخفي هذا التعادلَ: البحور المتساوية تبقى معلَنة في `ambiguity`.
  results.sort(
    (a, b) =>
      b.score - a.score ||
      sourceOrder(registry, a.meterId) - sourceOrder(registry, b.meterId) ||
      a.meterId.localeCompare(b.meterId)
  );
  return results;
}

/**
 * كل توزيعات الصيغ على الأشطر. لبحر بصيغتين وبيتٍ من شطرين تُنتج أربعة:
 * صدر‑عجز، وصدر‑صدر، وعجز‑صدر، وعجز‑عجز. عددها صغير دائمًا (٢ أو ٤)
 * لأن الصيغ لا تتجاوز اثنتين والأشطر لا تتجاوز شطرين.
 */
function formCombinations(formCount, repeat) {
  let out = [[]];
  for (let r = 0; r < repeat; r++) {
    const next = [];
    for (const prefix of out) {
      for (let f = 0; f < formCount; f++) next.push([...prefix, f]);
    }
    out = next;
  }
  return out;
}

function round(x) {
  return Math.round(x * 1e6) / 1e6;
}

/**
 * عند تساوي الدرجتين تُرجَّح الصيغة الموافقة للحقل المكتوب فيه:
 * ما كُتب في حقل العجز فصورة العجز أولى به. والأعلى درجةً يفوز دائمًا،
 * فلا يُتجاوَز الوزن — الترجيح عند التساوي وحده.
 */
function betterForm(candidate, current, preferRole) {
  if (candidate.score > current.score + 1e-12) return true;
  if (candidate.score < current.score - 1e-12) return false;
  if (!preferRole) return false;
  return candidate.formRole === preferRole && current.formRole !== preferRole;
}

/** موضع البحر في قائمة المصدر — به يُرجَّح عند تساوي الدرجات. */
function sourceOrder(registry, meterId) {
  const m = registry.byId.get(meterId);
  return m && Number.isFinite(m.sourceIndex) ? m.sourceIndex : Number.MAX_SAFE_INTEGER;
}

  Object.assign(__M, { matchMeter, rankMeters });
}

{
/**
 * تحليل بيت واحد: من النصّ الخام إلى نتيجة مستقلة عن أي واجهة.
 */

const { normalize, splitHemistichs } = __M;
const { phonemize } = __M;
const { buildReadableDag, freeSyllabify, edgeToSyllable } = __M;
const { rankMeters } = __M;

/** يبني الكتابة العروضية من الوحدات — النصّ كما يُنطق لا كما يُرسم. */
function prosodicSpelling(units) {
  const mark = { a: 'َ', i: 'ِ', u: 'ُ' };
  const mater = { a: 'ا', i: 'ي', u: 'و' };
  let out = '';
  let word = -1;
  for (const u of units) {
    if (u.word !== word) { if (word !== -1) out += ' '; word = u.word; }
    out += u.c;
    const v = u.vowel;
    if (!v.known) out += '؟';
    else if (v.length === 'none') out += 'ْ';
    else if (v.length === 'short') out += mark[v.quality] || '';
    else out += (mark[v.quality] || '') + (mater[v.quality] || '');
  }
  return out;
}

function analyzeUnit(text, engine, options) {
  const norm = normalize(text, options.normalize);
  const { units: raw, trace } = phonemize(norm.words, engine.lexicon, {
    pausalEnd: options.pausalEnd !== false,
  });
  // تشكيلٌ لا يقبل تقطيعًا (ساكنان متتاليان) يُرخى ويُعلَن، ولا يُترك
  // فيخرج التحليل فارغًا.
  const readable = buildReadableDag(raw, options.dag);
  const units = readable.units;
  const dag = readable.dag;
  const free = freeSyllabify(dag);
  const ranking = rankMeters(dag, engine.registry, engine.scorer, {
    repeats: options.repeats || [1],
    preferRole: options.preferRole,
    // تلزمان لمعرفة أي مقطع من أي كلمة، وأيّ كلمتين تماثلتا رسمًا —
    // وبهما يُقاس اتّساق القراءة.
    units,
    words: norm.words,
  });
  return { norm, units, phonTrace: trace, dag, free, ranking, readable };
}

/** يستخرج المقاطع الفعلية التي اختارها البحر الفائز. */
function syllablesFromMatch(match) {
  if (!match || !match.feet) return [];
  return match.feet.flatMap((f) =>
    f.ops.filter((o) => o.edge).map((o) => edgeToSyllable(o.edge))
  );
}

/** يربط كل تفعيلة بالكلمات التي وقعت فيها (البند 11 من المواصفة). */
function linkFeetToWords(match, units, words, brokenThreshold) {
  if (!match || !match.feet) return [];
  return match.feet.map((f) => {
    const [a, b] = f.unitSpan;
    const span = units.slice(a, b);
    const wordIdx = [...new Set(span.map((u) => u.word))];
    return {
      footIndex: f.footIndex,
      hemistich: f.hemistich,
      tafila: f.tafila,
      tafilaId: f.tafilaId,
      realized: f.variant.result,
      variation: f.variant.name,
      // معرّف الصورة لا اسمها: التعريف يُقرأ به من البيانات.
      variationId: f.variant.id,
      variationKind: f.variant.kind,
      expected: f.expected.join(''),
      actual: f.actual.join('') || '—',
      sound: f.alignCost < brokenThreshold,
      words: wordIdx.map((i) => words[i]?.text).filter(Boolean),
      text: span.map((u) => u.c).join(''),
    };
  });
}

/**
 * @param {string} input
 * @param {object} engine  ناتج createEngine
 * @param {object} [options]
 */
function analyzeLine(input, engine, options = {}) {
  const opts = { ...options };
  const split = splitHemistichs(input);
  const scorer = engine.scorer;

  let mode;
  let unitsAnalysis;
  let ranking;
  let hemistichRuns = null;

  if (split.explicit && split.parts.length >= 2) {
    // شطران مفصولان: يُقطَّع كلٌّ منهما وحده ثم تُجمع الدرجتان.
    mode = 'hemistichs';
    hemistichRuns = split.parts.map((p) =>
      analyzeUnit(p, engine, { ...opts, repeats: [1] })
    );
    const merged = new Map();
    for (const run of hemistichRuns) {
      for (const r of run.ranking) {
        const cur = merged.get(r.meterId) || { sum: 0, n: 0, sample: r };
        cur.sum += r.score;
        cur.n += 1;
        merged.set(r.meterId, cur);
      }
    }
    ranking = [...merged.entries()]
      .map(([meterId, v]) => ({
        ...v.sample,
        meterId,
        score: round(v.sum / hemistichRuns.length),
        confidence: round((v.sum / hemistichRuns.length) *
          (hemistichRuns.some((h) => h.dag.assumedVocalization)
            ? 1 - scorer.config.uncertainty.assumedVocalizationPenalty : 1)),
        perHemistich: hemistichRuns.map(
          (h) => h.ranking.find((x) => x.meterId === meterId)?.score ?? 0
        ),
        // كل شطر اختار صيغته باستقلال، فتُجمع اختياراتهم بالترتيب.
        formRoles: hemistichRuns.map(
          (h) => h.ranking.find((x) => x.meterId === meterId)?.formRole ?? null
        ),
      }))
      .sort((a, b) => b.score - a.score || a.meterId.localeCompare(b.meterId));
    unitsAnalysis = hemistichRuns[0];
  } else {
    // بلا فاصل: نجرّب أن يكون شطرًا واحدًا وأن يكون بيتًا كاملًا،
    // ونترك الوزن نفسه يحسم أيّهما، بدل تخمين موضع القسمة.
    mode = 'single';
    unitsAnalysis = analyzeUnit(input, engine, { ...opts, repeats: opts.repeats || [1, 2] });
    ranking = unitsAnalysis.ranking;
  }

  const best = ranking[0] || null;

  // بحور تعادل الأول ضمن فارق لا يُعتدّ به. الإفصاح عنها ضروري:
  // نصّ غير مشكول يقبل قراءات كثيرة، فقد يوافق أكثر من بحر بالدرجة
  // نفسها، وإخفاء ذلك خلف «الأول في الترتيب» ادّعاءُ يقين لا نملكه.
  const { tieDelta, ambiguityPenalty } = scorer.config.uncertainty;
  const tied = best
    ? ranking.filter((r) => r !== best && best.score - r.score <= tieDelta)
    : [];
  const ambiguous = tied.length > 0;
  if (ambiguous && best) {
    best.confidence = round(best.confidence * (1 - ambiguityPenalty));
  }

  const alternatives = ranking
    .slice(1, 1 + scorer.ranking.maxAlternatives)
    .filter((r) => r.score >= scorer.ranking.minScoreToList)
    .map((r) => ({
      meterId: r.meterId, name: r.name, score: r.score,
      confidence: r.confidence, verdict: r.verdict, repeat: r.repeat,
    }));

  const { norm, units, dag, free, phonTrace, readable } = unitsAnalysis;
  const chosenSyllables = mode === 'single' && best
    ? syllablesFromMatch(best)
    : free.syllables;
  const displaySyllables = chosenSyllables.length ? chosenSyllables : free.syllables;

  const verdict = best ? best.verdict : 'unrecognized';

  return {
    input,
    mode,
    hemistichCount: split.explicit ? split.parts.length : (best?.repeat || 1),
    normalized: norm.text,
    removed: norm.removed,
    vocalization: {
      hasDiacritics: norm.hasDiacritics,
      coverage: norm.vocalizationCoverage,
      assumed: dag.assumedVocalization,
      // سكونات أُرخيت لأن التشكيل المكتوب لا يقبل تقطيعًا.
      relaxedSukun: readable ? readable.relaxed : 0,
      readable: readable ? readable.readable : true,
      note: dag.assumedVocalization
        ? 'النصّ غير مشكول بالكامل، فالتقطيع المعروض هو القراءة التي يقبلها الوزن الفائز، لا قراءة يقينية.'
        : 'النصّ مشكول بما يكفي لتقطيع قاطع.',
    },
    prosodic: prosodicSpelling(units),
    syllables: displaySyllables.map((s) => ({
      weight: s.weight, shape: s.shape, onset: s.onset,
      // النواة وحركتها يحتاجهما تحليل القافية ليعرف حرف المدّ: الألف
      // من الفتحة والياء من الكسرة والواو من الضمة. إسقاطهما كان يُخفي
      // حروف المدّ كلها عن القافية فتختلّ حدودها ونوعها.
      nucleus: s.nucleus, quality: s.quality,
      // مواضع الوحدات التي كوّنت المقطع: بها يُرجَع إلى رسم الحرف
      // الأصلي — وبه تُعرف هاء الوقف المنقلبة عن تاء مربوطة، فلا
      // تُحسَب رويًّا وهي وصل.
      units: s.units,
      coda: s.coda, rule: s.rule, ishbaa: s.ishbaa, assumed: s.assumed,
    })),
    numericPattern: engine.encoder.encode(displaySyllables).value,
    numericPatterns: engine.encoder.encodeAll(displaySyllables),
    internalPattern: displaySyllables.map((s) => s.weight).join(''),
    bestMeter: best
      ? {
          id: best.meterId, name: best.name, aliases: best.aliases,
          score: best.score, confidence: best.confidence,
          verdict: best.verdict, repeat: best.repeat, status: best.status,
          formRole: best.formRole || null,
          formRoles: best.formRoles || (best.formRole ? [best.formRole] : []),
        }
      : null,
    verdict,
    tafaeel: mode === 'single' ? linkFeetToWords(best, units, norm.words, scorer.brokenFootThreshold) : (best?.feet || []).map((f) => ({
      footIndex: f.footIndex, hemistich: f.hemistich, tafila: f.tafila,
      realized: f.variant.result, variation: f.variant.name,
      expected: f.expected.join(''), actual: f.actual.join('') || '—',
    })),
    brokenFeet: best?.brokenFeet || [],
    alternatives,
    ambiguity: ambiguous
      ? {
          tiedWith: tied.map((r) => ({ id: r.meterId, name: r.name, score: r.score })),
          delta: tieDelta,
          reason: dag.assumedVocalization

      case: 'A',
      title: `موزون على ${best.name}`,

    return {
      case: 'A',
      title: `موزون على ${best.name} مع رخص`,
      text: licensed.length
        ? `البيت موزون على ${best.name}؛ ودخلت ${licensed.length} من تفعيلاته صورٌ مزاحَفة أو معلولة وكلها جائزة: ${licensed.map((f) => `${f.tafila} ← ${f.variant.name}`).join('، ')}.`

      text: b
        ? `أقرب البحور ${best.name} بدرجة ${pct(best.score)}. موضع الخلل التفعيلة ${b.footIndex + 1} (${b.tafila}): البحر يطلب ${b.expected} والبيت أعطى ${b.actual}.`

    case: 'D',
    title: 'لا وزن مقنع',
    text: `أعلى درجة بلغها البيت ${pct(best.score)} على ${best.name}، وهي دون عتبة القبول (${pct(t.broken)}).`,

const round = (x) => Math.round(x * 1e6) / 1e6;

  Object.assign(__M, { analyzeLine });

/**
 * PoemAnalyzer — تحليل قصيدة لا بيتًا واحدًا (البند 16).
 *
 * البحر الغالب يُستنتج من مجموع درجات كل بحر عبر الأبيات لا من عدد
 * الأبيات التي تصدّرها. السبب: بيت واحد يتصدّره بحر بفارق ضئيل لا ينبغي

const { splitLines } = __M;

function analyzePoem(input, engine, options = {}) {
  const lines = Array.isArray(input) ? input : splitLines(input);
  const results = lines.map((line, i) => ({
    index: i,
    ...analyzeLine(line, engine, options),
  }));

  const tally = new Map();
  for (const r of results) {
    if (!r.bestMeter) continue;
    const cur = tally.get(r.bestMeter.id) || {
      id: r.bestMeter.id, name: r.bestMeter.name, lines: 0, scoreSum: 0,
    };
    cur.lines += 1;
    cur.scoreSum += r.bestMeter.score;
    tally.set(r.bestMeter.id, cur);
  }

  const distribution = [...tally.values()]
    .map((t) => ({
      ...t,
      share: round(t.lines / (results.length || 1)),
      averageScore: round(t.scoreSum / t.lines),
    }))
    .sort((a, b) => b.scoreSum - a.scoreSum || a.id.localeCompare(b.id));

  const dominant = distribution[0] || null;

  // بيت خارج عن الوزن الغالب: إما تصدّره بحر آخر، وإما لم يبلغ عتبة القبول.
  const outliers = results
    .map((r) => {
      if (!r.bestMeter) {
        return { index: r.index, input: r.input, reason: 'لم يوافق أي بحر', score: 0 };
      }
      if (dominant && r.bestMeter.id !== dominant.id) {
        const onDominant = r.alternatives.find((a) => a.meterId === dominant.id);
        return {
          index: r.index, input: r.input,
          reason: `تصدّره ${r.bestMeter.name} لا ${dominant.name}`,
          score: r.bestMeter.score,
          scoreOnDominant: onDominant ? onDominant.score : null,
        };
      }
      if (r.verdict === 'broken' || r.verdict === 'unrecognized') {
        return {
          index: r.index, input: r.input,
          reason: `على ${r.bestMeter.name} لكنه مكسور`,
          score: r.bestMeter.score,
          brokenFeet: r.brokenFeet,
        };
      }
      return null;
    })
    .filter(Boolean);

  const unclear = results.filter((r) => !r.bestMeter || r.verdict === 'unrecognized').length;

  return {
    lineCount: results.length,
    distribution,
    dominantMeter: dominant
      ? { id: dominant.id, name: dominant.name, lines: dominant.lines, averageScore: dominant.averageScore }
      : null,
    unclear,
    consistency: dominant ? round(dominant.lines / (results.length || 1)) : 0,
    outliers,
    lines: results.map((r) => ({
      index: r.index,
      input: r.input,
      meter: r.bestMeter?.name || null,
      meterId: r.bestMeter?.id || null,
      score: r.bestMeter?.score ?? 0,
      confidence: r.bestMeter?.confidence ?? 0,
      verdict: r.verdict,
      brokenFeet: r.brokenFeet,
      tafaeel: r.tafaeel,
      numericPattern: r.numericPattern,
    })),
    full: results,
  };
}

const round = (x) => Math.round(x * 1e6) / 1e6;

  Object.assign(__M, { analyzePoem });
}

 * مطابقة **جزئية**: البيت وهو يُكتب، لا البيت بعد تمامه.
 *
 * الفرق عن `meterMatcher` واحد وجوهري: ما لم يُكتب بعد لا يُحاسَب.
 *
 * المطابق التامّ يفترض أن ما بين يديه شطر منتهٍ، فيغرّم النقص: تفعيلة

 * كتب «البا» لم يكسر مستفعلن، بل بلغ منها مقطعين ولمّا يبلغ الرابع.
 * فالنقص عنده خبرٌ عن موضعه من الشطر لا عيبٌ في شعره.
 *

 * ثمانية مقاطع لم يخبرنا بعدُ أيريد الحدا أم أوّل الرجز. ولذلك يُرجع
 * هذا الملف ترتيبًا ويُعلن التساوي، ولا يدّعي حسمًا لم يبلغه النصّ.

const { matchFootBoth, minSyllablesToEnd, createAlignmentCache } = __M;
const { edgeToSyllable } = __M;

/**
 * @param {object} dag مخطّط مقاطع ما كُتب
 * @param {object} meter من السجلّ
 * @param {object} scorer
 * @param {{ form?: number }} [options] أي صيغتَي البحر تُجرَّب (صدر/عجز)
 */
function matchMeterPartial(dag, meter, scorer, options = {}) {
  const formIndex = options.form || 0;
  const form = pickForm(meter, formIndex);
  const feet = expandForm(form);
  if (!feet.length) return null;

  const end = dag.size; // موضع آخر وحدة كُتبت
  const tailCost = minSyllablesToEnd(dag);

  let states = new Map([[0, { cost: 0, chosen: [] }]]);
  let best = null;

  /** ينظر في مرشَّح انتهت عنده الكتابة، ويحتفظ بأقلّه كلفةً. */
  const considerTerminal = (cost, chosen, footsDone, pending) => {
    const typed = countTyped(chosen, pending);
    // مقياس الترتيب: الكلفة منسوبةً إلى ما كُتب. القسمة على طول البحر
    // كاملًا تُجازي البحور الطويلة على طولها لا على موافقتها.
    const norm = Math.max(typed, scorer.config.normalizer.floor);
    const scored = cost / (norm * scorer.config.normalizer.perSyllableCost);
    if (!best || scored < best.scored - 1e-12) {
      best = { cost, chosen, footsDone, pending, typed, scored };
    }

    const foot = feet[f];
    const posCtx = { isFirst: foot.isFirst, isArudDarb: foot.isArudDarb };
    const posMult = scorer.positionMultiplier(posCtx);
    const next = new Map();

    for (const [u, state] of states) {
      // (أ) الكتابة بلغت هذا الحدّ تمامًا: التفعيلات الباقية لم تُكتب بعد.
      if (u === end) considerTerminal(state.cost, state.chosen, f, null);

        // يضاعف كلفة أسخن حلقة في المحرك بلا فائدة.

            // `matchFootBoth` تُخرجها في `ends` لا في `prefixes`.
            if (filled === 0) continue;

              state.cost + (vCost + res.cost) * posMult,
              state.chosen,
              f,
              { footIndex: f, foot, variant, filled, res, unitSpan: [u, end], posMult, vCost }
            );

          if (to === u) continue; // تفعيلة لم تستهلك شيئًا: لا معنى لها هنا
          const cost = state.cost + (vCost + res.cost) * posMult;
          const prev = next.get(to);

            cost,
            chosen: [...state.chosen, describeFoot(f, foot, variant, res, [u, to], vCost, posMult)],

    const leftover = tailCost[u];

    ? partialFootView(best.pending)

    name: meter.name,
    aliases: meter.aliases,
    status: meter.status,
    form: formIndex,
    formRole: form.role || null,
    matched: true,
    // الدرجة هنا درجة **موافقة ما كُتب**، لا درجة البيت. تُقرأ: هل ما

    complete,
    feet: best.chosen,
    partialFoot,

    // منها تُشتقّ حروف كل تفعيلة، فتصطفّ مع رمزها.
    syllables: [
      ...best.chosen.flatMap((c) => c.ops.filter((o) => o.edge).map((o) => edgeToSyllable(o.edge))),
      ...(best.pending
        ? best.pending.res.ops.filter((o) => o.edge).map((o) => edgeToSyllable(o.edge))
        : []),
    ],
    // التفعيلات التي لم يبلغها القلم بعد — تُعرض باهتةً لا ناقصةً.
    remaining: feet
      .slice(best.footsDone + (best.pending ? 1 : 0))
      .map((x) => ({ tafila: x.plain, tafilaId: x.tafilaId, syllables: x.salim })),
    cost: round(best.cost),
    assumedVocalization: dag.assumedVocalization,
  };
}

    (a, b) =>

      // عند التساوي يُقدَّم الأقصر: من كتب ثمانية مقاطع فالحدا أقرب
      // احتمالًا من ربع الرجز، وهذا ترجيح عرضٍ لا حكمٌ على الوزن —
      // والتساوي مُعلَن في `tied` على كل حال.
      a.meterSyllables - b.meterSyllables ||

 * الصورتين بالدرجة نفسها. والوزن لا يرجّح بينهما حينئذ — لكن الحقل

 *
 * وهذا استعمالٌ لخبرٍ تملكه الواجهة، لا تجاوزٌ للوزن: الأعلى درجةً
 * يفوز دائمًا، والدور هنا عند التساوي وحده.

    ...foot,
    isFirst: i === 0,
    isArudDarb: i === form.feet.length - 1,

    footIndex: f,
    tafila: foot.plain,
    tafilaId: foot.tafilaId,
    variant: { id: variant.id, name: variant.name, result: variant.result, kind: variant.kind },
    expected: variant.syllables,
    actual: res.syllables.map((e) => e.weight),
    unitSpan,
    alignCost: res.cost,
    ops: res.ops,
    complete: true,
    totalCost: (vCost + res.cost) * posMult,

    footIndex: p.footIndex,
    tafila: p.foot.plain,
    tafilaId: p.foot.tafilaId,
    variant: { id: p.variant.id, name: p.variant.name, result: p.variant.result, kind: p.variant.kind },

    filled: p.filled,
    of: p.variant.syllables.length,
    expected: p.variant.syllables,
    actual: p.res.syllables.map((e) => e.weight),

    if (x.relaxedSukun) {
      add('vocalization', `${where}: تشكيلٌ لا يقبل تقطيعًا، فأُرخيت ${x.relaxedSukun} من سكوناته`, {
        hemistich: h.role, count: x.relaxedSukun,
      });
    }
    if (x.assumedVocalization) {
      add('vocalization', `${where}: النصّ غير مشكول بالكامل، فالتقطيع قراءةٌ قبِلها الوزن لا قراءةٌ يقينية`, {
        hemistich: h.role,
      });
    }
    if (x.tied && x.tied.length) {
      add('ambiguity', `${where}: بحور توافق بالدرجة نفسها — ${x.tied.map((t) => t.name).join('، ')}`, {
        hemistich: h.role, tiedWith: x.tied,
      });
    }
    if (x.meter && x.meter.status === 'NEEDS_VALIDATION') {
      add('meter', `${where}: تعريف «${x.meter.name}» يحتاج تحقّقًا`, {
        hemistich: h.role, meterId: x.meter.id,
      });
    }
    if (x.rhyme && x.rhyme.rawi && x.rhyme.rawi.caution) {
      add('rhyme', `${where}: قد تكون «${x.rhyme.rawi.letter}» حرف وصل لا رويًّا`, {
        hemistich: h.role, letter: x.rhyme.rawi.letter,
      });
    }
  }

  if (disagreement) {
    add('meter', `الشطران على بحرين: ${disagreement.map((d) => `${d.label} ${d.name || '—'}`).join('، ')}`, {
      hemistichs: disagreement,
    });
  }

  // ما لم يُحسم في القاعدة نفسها — لا يتعلّق بهذا البيت بل بالبيانات.
  for (const q of engine.openQuestions()) {
    add('open_question', `${q.area}: ${q.issue || ''}`.trim(), { id: q.id, gaps: q.gaps });
  }

  return out;
}

/* ─────────────── بطاقات التفعيلات ─────────────── */

/** تعريف الصورة من البيانات — لا نصّ منها مكتوب في الكود. */
function licenceOf(engine, variantId, baseName, resultName, variantName) {
  const def = engine.data.variations.definitions?.[variantId];
  if (!def) return null;
  return {
    id: variantId,
    name: variantName,
    category: def.category,
    definition: def.definition,
    from: baseName,
    to: resultName,
  };
}

/**
 * التفعيلة المزيدة زيادتُها علّة وإن كانت في القاعدة تفعيلةً مستقلّة.
 *
 * «فاعلاتان» في هذه القاعدة تفعيلةٌ قائمة بنفسها لا صورةٌ من صور
 * «فاعلاتن»، لأن العجز يُبنى عليها. لكنها في العروض زيادةُ ساكنٍ على
 * فاعلاتن، وإخفاء ذلك يجعل عجز البيت يبدو بلا علّة وهو معلول.
 *
 * والاسم يُشتقّ ولا يُكتب: الزيادة على آخره وتد مجموع (مقطعان S ثم L)
 * تذييلٌ، وعلى سبب خفيف تسبيغٌ.
 */
function addedSakinLicence(engine, tafilaId) {
  const t = engine.registry.tafilaById.get(tafilaId);
  if (!t || t.family !== 'mudhayyal' || !t.baseOf) return null;
  const base = engine.registry.tafilaById.get(t.baseOf);
  if (!base) return null;
  const last2 = base.syllables.slice(-2).join('');
  const id = last2 === 'SL' ? 'tadhyil' : 'tasbeegh';
  const def = engine.data.variations.definitions?.[id];
  if (!def) return null;
  return {
    id,
    name: id === 'tadhyil' ? 'التذييل' : 'التسبيغ',
    category: def.category,
    definition: def.definition,
    from: base.plain,
    to: t.plain,
  };
}

function cardState(engine, tafilaId, isSalim, variationName) {
  if (!isSalim) return variationName;
  const added = addedSakinLicence(engine, tafilaId);
  return added ? added.name : STATE.salim;
}

function cardKind(engine, tafilaId, isSalim) {
  if (!isSalim) return 'licensed';
  return addedSakinLicence(engine, tafilaId) ? 'licensed' : 'salim';
}

function card(engine, { name, syllables, state, kind, variation, text, broken, dim, licence }) {
  return {
    name,
    // الرمز العروضي يُشتقّ من المقاطع بالترميز نفسه الذي يستعمله المحرك،
    // لا بجدول مكتوب في الواجهة.
    symbol: engine.encoder.encode(syllables, 'arudi_slash_zero').value,
    text: text || '',
    state,
    kind: kind || null,
    variation: variation || null,
    licence: licence || null,
    broken: !!broken,
    dim: !!dim,
  };
}

/** اسم الصورة مجرَّدًا من التشكيل — للعرض في سطر العلّة. */
function plainName(vocalized) {
  return [...String(vocalized)].filter((c) => !/[\u064B-\u0652\u0670]/.test(c)).join('');
}

function cardsFromFull(full, engine, letters) {
  const texts = splitLettersByFeet(
    letters,
    full.tafaeel.map((f) => (f.actual === '—' ? 0 : [...f.actual].length))
  );
  return full.tafaeel.map((f, i) => {
    const broken = f.sound === false;
    const isSalim = !f.variation || f.variation === 'سالم';
    return card(engine, {
      name: f.tafila,
      syllables: [...f.expected],
      state: broken ? 'مكسورة' : cardState(engine, f.tafilaId, isSalim, f.variation),
      kind: broken ? 'broken' : cardKind(engine, f.tafilaId, isSalim),
      variation: isSalim ? null : f.variation,
      licence: isSalim
        ? addedSakinLicence(engine, f.tafilaId)
        : licenceOf(engine, f.variationId, f.tafila, plainName(f.realized), f.variation),
      text: texts[i] || '',
      broken,
    });
  });
}

function cardsFromPartial(best, engine, letters) {
  if (!best) return [];
  const counts = best.feet.map((f) => f.actual.length);
  if (best.partialFoot) counts.push(best.partialFoot.actual.length);
  const texts = splitLettersByFeet(letters, counts);
  const out = [];

  let i = 0;
  for (const f of best.feet) {
    const isSalim = f.variant.kind === 'salim';
    const broken = f.alignCost >= engine.scorer.brokenFootThreshold;
    out.push(card(engine, {
      name: partialTafilaName(f.variant.result, f.expected, f.expected.length),
      syllables: f.expected,
      state: broken ? 'مكسورة' : cardState(engine, f.tafilaId, isSalim, f.variant.name),
      kind: broken ? 'broken' : cardKind(engine, f.tafilaId, isSalim),
      variation: isSalim ? null : f.variant.name,
      licence: isSalim
        ? addedSakinLicence(engine, f.tafilaId)
        : licenceOf(engine, f.variant.id, f.tafila, plainName(f.variant.result), f.variant.name),
      text: texts[i++] || '',
      broken,
    }));
  }

  if (best.partialFoot) {
    const p = best.partialFoot;
    out.push(card(engine, {
      // الاسم مقتطعٌ بقدر ما كُتب: «مستف» لا «مستفعلن».
      name: partialTafilaName(p.variant.result, p.expected, p.filled),
      syllables: p.expected.slice(0, p.filled),
      state: STATE.partial,
      kind: 'partial',
      text: texts[i++] || '',
    }));
  }

  for (const r of best.remaining) {
    out.push(card(engine, {
      name: r.tafila,
      syllables: r.syllables,
      state: STATE.pending,
      kind: 'pending',
      dim: true,
    }));
  }

  return out;
}

  Object.assign(__M, { analyzeHemistich, analyzeLive });
}

// ── engine/js/analysis/trainingMode.js ──
{
/**
 * TrainingMode — وضع التدريب (البند 17).
 *
 * المستخدم يختار بحرًا ويكتب بيتًا، فيُقاس البيت على البحر المختار وحده،
 * ثم يُقارَن بأقرب بحر آخر. الفائدة أن يعرف المتدرّب أمرين معًا:
 * أخطأ في الوزن الذي قصده، أم أصاب وزنًا آخر غير الذي قصده.
 */

const { analyzeLine } = __M;

const DIFFICULTY = {
  easy: { requiredScore: 0.80, allowVariations: true, hintLevel: 'full' },
  medium: { requiredScore: 0.90, allowVariations: true, hintLevel: 'partial' },
  hard: { requiredScore: 0.97, allowVariations: false, hintLevel: 'minimal' },
};

/**
 * @param {string} input بيت المتدرّب
 * @param {string} targetMeter اسم البحر أو معرّفه
 * @param {object} engine
 * @param {{ difficulty?: 'easy'|'medium'|'hard' }} [options]
 */
function checkAttempt(input, targetMeter, engine, options = {}) {
  const level = DIFFICULTY[options.difficulty || 'medium'];
  const meter = engine.registry.find(targetMeter);

  if (!meter) {
    return { ok: false, error: `لا يوجد بحر بهذا الاسم: ${targetMeter}`, available: engine.listMeters() };
  }
  if (!meter.enabled) {
    return { ok: false, error: `البحر ${meter.name} غير مفعَّل: ${meter.status}`, reason: meter.derivation?.why_not_implemented };
  }

  const analysis = analyzeLine(input, engine, options);
  const onTarget = [analysis.bestMeter, ...analysis.alternatives]
    .find((m) => m && (m.id || m.meterId) === meter.id);
  const targetScore = onTarget ? onTarget.score : 0;

  const usedLicense = (analysis.tafaeel || []).filter(
    (f) => f.variationKind && f.variationKind !== 'salim'
  );
  const violatesStrictness = !level.allowVariations && usedLicense.length > 0;
  const correct = targetScore >= level.requiredScore && !violatesStrictness;

  const feedback = [];
  if (correct) {
    feedback.push({
      kind: 'success',
      text: `أصبت. البيت على ${meter.name} بدرجة ${pct(targetScore)}.`,
    });
  } else {
    if (targetScore < level.requiredScore) {
      feedback.push({
        kind: 'score',
        text: `درجة البيت على ${meter.name} ${pct(targetScore)}، والمطلوب في هذا المستوى ${pct(level.requiredScore)}.`,
      });
    }
    if (violatesStrictness) {
      feedback.push({
        kind: 'strictness',
        text: `المستوى الصعب يطلب التفعيلات سالمة، وقد دخلت الرخص في: ${usedLicense.map((f) => f.tafila).join('، ')}.`,
      });
    }
    for (const b of analysis.brokenFeet) {
      feedback.push({
        kind: 'broken_foot',
        footIndex: b.footIndex,
        text: `التفعيلة ${b.footIndex + 1} (${b.tafila}): المتوقَّع ${b.expected} والواقع ${b.actual}.`,
        issues: b.issues,
      });
    }
    if (analysis.bestMeter && analysis.bestMeter.id !== meter.id) {
      feedback.push({
        kind: 'other_meter',
        text: `البيت أقرب إلى ${analysis.bestMeter.name} (${pct(analysis.bestMeter.score)}) منه إلى ${meter.name}.`,
      });
    }
  }

  return {
    ok: true,
    correct,
    targetMeter: { id: meter.id, name: meter.name, tafaeel: meter.tafaeelNames },
    difficulty: options.difficulty || 'medium',
    requiredScore: level.requiredScore,
    achievedScore: targetScore,
    expectedPattern: level.hintLevel === 'minimal' ? null : meter.pattern.join(''),
    actualPattern: analysis.internalPattern,
    feedback,
    analysis: level.hintLevel === 'full' ? analysis : undefined,
  };
}

/** تمارين مقترحة: البحور المفعَّلة مع تفعيلاتها. */
function exercises(engine) {
  return engine.registry.enabled.map((m) => ({
    id: m.id,
    name: m.name,
    aliases: m.aliases,
    tafaeel: m.tafaeelNames,
    pattern: m.pattern.join(''),
    syllableCount: m.pattern.length,
  }));
}

const pct = (x) => `${Math.round(x * 100)}%`;

  Object.assign(__M, { DIFFICULTY, checkAttempt, exercises });
}

// ── engine/js/debug/trace.js ──
{
/**
 * Debug Mode (البند 24).
 *
 * يُفعَّل بمتغيّر البيئة DEBUG_PROSODY=true في Node، أو بالراية
 * `debug: true` في الاستدعاء، أو بالمفتاح `?debug=1` في صفحة المتصفح.
 *
 * يعرض كل مرحلة على حدة: الأصل ← المطبَّع ← العروضي ← الوحدات ←
 * المقاطع ← النمط الرقمي ← المرشّحون ← المطابقة ← الدرجة.
 */

function isDebugEnabled(explicit) {
  if (explicit !== undefined) return !!explicit;
  if (typeof process !== 'undefined' && process.env) {
    const v = process.env.DEBUG_PROSODY;
    if (v && v !== '0' && v.toLowerCase() !== 'false') return true;
  }
  if (typeof location !== 'undefined' && location.search) {
    return /[?&]debug=1\b/.test(location.search);
  }
  return false;
}

/** تقرير نصّي متسلسل لمراحل التحليل. */
function traceReport(result) {
  const L = [];
  const line = (label, value) => L.push(`${label.padEnd(22)} ${value}`);

  line('Original', result.input);
  line('Normalized', result.normalized);
  if (result.removed?.length) {
    for (const r of result.removed) {
      line('  removed', `${r.what} ×${r.count} — ${r.why}`);
    }
  }
  line('Prosodic', result.prosodic);
  line('Vocalization', `coverage=${result.vocalization.coverage} assumed=${result.vocalization.assumed}`);

  const int = result.internalPattern || '';
  line('Syllables', result.syllables.map((s) => `${s.weight}(${s.shape})`).join(' '));
  line('Internal pattern', int);
  for (const [id, enc] of Object.entries(result.numericPatterns || {})) {
    line(`  ${id}`, enc.value === null ? `— (${enc.status})` : `${enc.value} [${enc.status}]`);
  }

  if (result.bestMeter) {
    line('Best meter', `${result.bestMeter.name} score=${result.bestMeter.score} conf=${result.bestMeter.confidence} verdict=${result.verdict}`);
    line('Expected pattern', result.tafaeel.map((f) => f.expected).join(' '));
    line('Actual pattern', result.tafaeel.map((f) => f.actual).join(' '));
    for (const f of result.tafaeel) {
      line(`  foot ${f.footIndex + 1}`, `${f.tafila} → ${f.realized} (${f.variation}) ${f.sound === false ? '✗' : '✓'} «${f.words?.join(' ') ?? ''}»`);
    }
  } else {
    line('Best meter', '—');
  }

  for (const b of result.brokenFeet || []) {
    line(`  broken ${b.footIndex + 1}`, `${b.tafila} expected=${b.expected} actual=${b.actual} cost=${b.cost}`);
    for (const i of b.issues || []) line('    issue', i.text);
  }

  for (const a of result.alternatives || []) {
    line('Alternative', `${a.name} ${Math.round(a.score * 100)}%`);
  }

  return L.join('\n');
}

/** المخطّط كله كنصّ — للتشخيص حين يفشل التقطيع. */
function dumpDag(dag, units) {
  const L = [`DAG: ${dag.size} units, assumed=${dag.assumedVocalization}`];
  for (let i = 0; i < units.length; i++) {
    const u = units[i];
    const v = u.vowel.known
      ? `${u.vowel.length}${u.vowel.quality ? ':' + u.vowel.quality : ''}`
      : `?[${u.vowel.options.join('|')}]`;
    L.push(`  #${i} ${u.c} ${v} word=${u.word}${u.source ? ' <' + u.source + '>' : ''}`);
    for (const e of dag.edges[i] || []) {
      L.push(`      → ${e.to} ${e.weight} ${e.meta.shape}${e.meta.rule ? ' [' + e.meta.rule + ']' : ''}`);
    }
  }
  return L.join('\n');
}

  Object.assign(__M, { isDebugEnabled, traceReport, dumpDag });
}
