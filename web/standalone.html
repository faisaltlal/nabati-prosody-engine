{
/**
 * محرك عروض الشعر النبطي — نقطة الدخول الوحيدة.
 *
 * المحرك حتمي بالكامل: لا عشوائية، ولا نموذج لغوي، ولا نسبة مقدَّرة.
 * النصّ نفسه مع البيانات نفسها يعطي النتيجة نفسها في كل تشغيل.
 *
 *   import { createEngine } from './engine/js/index.js';
 *   import { DATA } from './engine/js/data.generated.js';
 *   const engine = createEngine(DATA);
 *   engine.analyze('بيت من الشعر');
 */

const { buildRegistry } = __M;
const { createScorer } = __M;
const { createEncoder } = __M;
const { analyzeLine } = __M;
const { analyzePoem } = __M;
const { analyzeLive, analyzeHemistich } = __M;
const { checkAttempt, exercises, DIFFICULTY } = __M;
const { isDebugEnabled, traceReport, dumpDag } = __M;
const { normalize, splitHemistichs, splitLines } = __M;
const { phonemize } = __M;
const { buildSyllableDag, freeSyllabify } = __M;
const { matchMeter, rankMeters } = __M;

/**
 * نطق أسماء التفعيلات، مشتقًّا من `tafaeel.json` و`variations.json`.
 *
 * الفائدة عملية: هذه صفحة تجربةٍ للمحرك، وأكثر ما يُكتب فيها للاختبار
 * أسماءُ التفعيلات نفسها. و«مستفعلن» مجرّدةً من التشكيل تحتمل قراءات،
 * فيتعادل عليها الرجز والرمل والوافر تعادلًا تامًّا — ومَن كتبها إنما
 * أراد `مُسْتَفْعِلُنْ` لا غير.
 *
 * ولا اختراع فيه: التشكيل مأخوذ من البيانات نفسها التي يُبنى منها
 * البحر. وما احتمل نطقين — «فعلن» فَعِلُنْ أو فَعْلُنْ — يُترك حرًّا
 * ولا يُفرض عليه أحدهما.
 *
 * ولا يُطبَّق إلا على كلمة كُتبت مجرّدة: تشكيل الشاعر أولى دائمًا.
 */
function tafilaVocalizations(data) {
  const strip = (s) => [...s].filter((c) => !/[\u064B-\u0652\u0670]/.test(c)).join('');
  const seen = new Map();
  const add = (vocalized) => {
    const plain = strip(vocalized);
    if (!seen.has(plain)) seen.set(plain, new Set());
    seen.get(plain).add(vocalized);
  };
  for (const t of data.tafaeel.tafaeel) add(t.vocalized);
  for (const list of Object.values(data.variations.variations)) {
    for (const v of list) add(v.result);
  }
  const out = {};
  for (const [plain, forms] of seen) {
    if (forms.size === 1) out[plain] = [...forms][0]; // ما احتمل نطقين يُترك
  }
  return out;
}

function createEngine(data) {
  const registry = buildRegistry(data);
  const scorer = createScorer(data.scoring);
  const encoder = createEncoder(data.encodings);

  const engine = {
    registry,
    scorer,
    encoder,
    lexicon: { ...data.lexicon, tafilaVocalizations: tafilaVocalizations(data) },
    data,

    /** تحليل بيت واحد. */
    analyze(input, options = {}) {
      const debug = isDebugEnabled(options.debug);
      const result = analyzeLine(input, engine, { ...options, debug });
      if (debug) result.trace = traceReport(result);
      return result;
    },

    /**
     * التحليل اللحظي أثناء الكتابة — حقلا الصدر والعجز.
     * الحقل الفارغ لا يُعطّل شيئًا: يُحلَّل المكتوب وحده.
     */
    analyzeLive(fields, options = {}) {
      return analyzeLive(fields || {}, engine, options);
    },

    /** شطر واحد وهو يُكتب. */
    analyzeHemistich(text, options = {}) {
      return analyzeHemistich(text, engine, options);
    },

    /** تحليل قصيدة كاملة. */
    analyzePoem(input, options = {}) {
      return analyzePoem(input, engine, options);
    },

    /** وضع التدريب. */
    train(input, targetMeter, options = {}) {
      return checkAttempt(input, targetMeter, engine, options);
    },

    exercises() {
      return exercises(engine);
    },

    /** البحور المفعَّلة وغير المفعَّلة وما ينقصها. */
    listMeters() {
      return registry.meters.map((m) => ({
        id: m.id,
        name: m.name,
        aliases: m.aliases,
        enabled: m.enabled,
        status: m.status,
        sourceQuote: m.sourceQuote,
        tafaeel: m.tafaeelNames,
        pattern: m.pattern.join(''),
        syllableCount: m.pattern.length,
        blockedBy: m.enabled ? null : (m.derivation?.why_not_implemented || m.status),
        needs: m.enabled ? null : (m.derivation?.resolvedBy || m.validation?.resolvedBy),
      }));
    },

    /** كل ما يحتاج تحقّقًا — البند 26. */
    openQuestions() {
      const out = [];
      for (const t of data.tafaeel.tafaeel) {
        if (t.status === 'NEEDS_VALIDATION') {
          out.push({ area: 'tafila', id: t.id, name: t.plain, ...t.validation });
        }
      }
      for (const m of registry.meters) {
        if (m.status === 'NEEDS_VALIDATION') {
          out.push({
            area: 'meter', id: m.id, name: m.name,
            issue: m.validation?.issue || m.derivation?.why_not_implemented,
            resolvedBy: m.validation?.resolvedBy || m.derivation?.resolvedBy,
            enabled: m.enabled,
          });
        }
      }
      for (const s of data.encodings.schemes) {
        if (s.status === 'NEEDS_VALIDATION') {
          out.push({ area: 'encoding', id: s.id, issue: s.note, resolvedBy: s.resolvedBy });
        }
      }
      for (const n of registry.notInSource) {
        out.push({ area: 'missing_meter', name: n.name, issue: n.reason, resolvedBy: 'تفعيلات البحر' });
      }
      if (data.rhyme?.nabatiSpecific?.status === 'NEEDS_VALIDATION') {
        out.push({
          area: 'rhyme', id: 'nabatiRhyme',
          issue: data.rhyme.nabatiSpecific.note,

  btn.addEventListener('click', () => {
    const t = btn.dataset.tab;
    document.querySelectorAll('[role=tab]').forEach((b) => b.setAttribute('aria-selected', String(b === btn)));
    TABS.forEach((id) => $('#tab-' + id).classList.toggle('hidden', id !== t));
  });
});

/* ---------------- شطر أو بيت ---------------- */

/**
 * الوضع الافتراضي شطر: أكثر ما يُجرَّب وزنه شطرٌ واحد، وإظهار حقلين
 * لمن يريد واحدًا يضاعف ارتفاع الإدخال بلا فائدة.
 *
 * والتبديل لا يمسح شيئًا: الحقول الثلاثة قائمة دائمًا، وإنما يُخفى
 * ما لا يخصّ الوضع. فمن كتب شطرًا ثم أراد بيتًا وجد ما كتبه في الصدر.
 */
let mode = 'single';

function setMode(next, { carry = true } = {}) {
  if (next === mode) return;
  if (carry) {
    // ما كُتب يُنقل مع صاحبه: الشطر يصير صدرًا، والصدر يعود شطرًا.
    if (next === 'pair' && !$('#sadr').value.trim()) $('#sadr').value = $('#single').value;
    if (next === 'single' && !$('#single').value.trim()) $('#single').value = $('#sadr').value;
  }
  mode = next;
  document.querySelectorAll('.mode button').forEach((b) =>
    b.setAttribute('aria-checked', String(b.dataset.mode === mode))
  );
  $('#field-single').classList.toggle('hidden', mode !== 'single');
  $('#field-sadr').classList.toggle('hidden', mode !== 'pair');
  $('#field-ajz').classList.toggle('hidden', mode !== 'pair');
  lastKey = null;
  render();
}

document.querySelector('.mode').addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (b) setMode(b.dataset.mode);
});

/* ---------------- التحليل اللحظي ---------------- */

const VERDICT_LABEL = {
  sound: 'موزون',
  acceptable: 'موزون برخصة',
  broken: 'مكسور',
  unrecognized: 'غير محدَّد',
  writing: 'قيد الكتابة',
};

const FORM_LABEL = { sadr: 'صدر', ajz: 'عجز' };

/**
 * لا زرّ في هذه الصفحة: كل ضغطة مفتاح تُعيد الحساب.
 *
 * والتأخير القصير ليس تجميلًا: الضغطات تتلاحق أسرع من التحليل، فبلا
 * تأخير يُحسب الحرف الذي تجاوزه القلم. مئة وعشرون جزءًا من الألف
 * أقصر من أن يُحسّ وأطول من فاصل الضغطتين، فيبقى الإحساس لحظيًّا
 * ويُحسب آخر ما كُتب لا ما قبله.
 */
const DEBOUNCE_MS = 120;
let timer = null;
let lastKey = null;

function schedule() {
  clearTimeout(timer);
  timer = setTimeout(render, DEBOUNCE_MS);
}

/** ما يُرسل إلى المحرك، بحسب الوضع. */
function currentFields() {
  return mode === 'single'
    ? { single: $('#single').value }
    : { sadr: $('#sadr').value, ajz: $('#ajz').value };
}

function render() {
  const fields = currentFields();
  const key = mode + '␀' + Object.values(fields).join('␀');
  if (key === lastKey) return;
  lastKey = key;

  if (!Object.values(fields).some((v) => (v || '').trim())) {
    $('#result').innerHTML = '';
    return;
  }

  let r;
  try {
    r = engine.analyzeLive(fields);
  } catch (err) {
    $('#result').innerHTML =
      `<div class="panel"><div class="note warn">تعذّر التحليل: ${esc(err.message)}</div></div>`;
    return;
  }

  // التحفّظات لا تُعرض في الصفحة: هي خبرٌ عن حدود ما يقطع به المحرك،
  // موضعه سجلٌّ يقرؤه المطوّر لا شاشةٌ تُربك الشاعر. والمحرك يُرجعها
  // بيانًا، وهذه الطبقة هي التي تختار أن تكتبها هنا.
  reportWarnings(r.warnings);

  $('#result').innerHTML = r.empty ? '' : renderLive(r);
}

/** آخر ما أُبلغ عنه — يمنع تكرار السطر نفسه عند كل ضغطة مفتاح. */
let lastWarned = '';
function reportWarnings(warnings) {
  const list = warnings || [];
  window.nabatiWarnings = list;
  const key = list.map((w) => w.area + ':' + w.message).join('|');
  if (key === lastWarned) return;
  lastWarned = key;
  if (!list.length) return;
  console.groupCollapsed(`محرك العروض — تحفّظات (${list.length})`);
  for (const w of list) console.log(`[${w.area}] ${w.message}`, w);
  console.groupEnd();
}

for (const id of ['#single', '#sadr', '#ajz']) {
  $(id).addEventListener('input', schedule);
}

function renderLive(r) {
  const parts = [];
  const m = r.meter;

  // مربع الوزن — بلا نسبة ثقة: المطلوب البحر ودرجة المطابقة وحدهما.
  parts.push(`<div class="panel verdict-panel">
    <div class="verdict">
      <span class="name">${m ? esc(m.name) : 'لا بحر بعد'}</span>
      ${m ? `<span class="badge ${m.verdict}">${VERDICT_LABEL[m.verdict] || m.verdict}</span>` : ''}
      ${r.disagreement ? '<span class="badge broken">الشطران على بحرين</span>' : ''}
    </div>
    ${m ? `<div class="score-line">
      <div class="bar"><i style="width:${(m.score * 100).toFixed(1)}%"></i></div>
      <span class="pctn">${pct(m.score)}</span>
    </div>` : ''}
    ${r.disagreement ? `<div class="note warn">
      ${r.disagreement.map((d) => `${esc(d.label)}: ${esc(d.name || '—')}`).join(' · ')}
    </div>` : ''}
  </div>`);

  for (const h of r.hemistichs) {
    if (!h.result) continue;
    parts.push(renderHemistich(h));
  }

  return parts.join('');
}

function renderHemistich(h) {
  const x = h.result;
  const licences = x.cards.map((c) => c.licence).filter(Boolean);
  const broken = x.cards.filter((c) => c.kind === 'broken');
  // في وضع الشطر لا معنى لتسمية الحقل: ليس صدرًا ولا عجزًا.
  const showLabel = h.role !== null;

  return `<div class="panel">
    <div class="hemistich-head">
      ${showLabel ? `<span class="field-label">${esc(h.label)}</span>` : ''}
      ${x.meter ? `<span class="badge soft">${esc(x.meter.name)}</span>` : ''}
      ${x.meter && x.meter.formRole ? `<span class="badge soft">${esc(FORM_LABEL[x.meter.formRole] || x.meter.formRole)}</span>` : ''}
      ${x.complete ? '' : '<span class="badge writing">قيد الكتابة</span>'}
    </div>

    ${x.letters && x.letters.length ? `<div class="glyphs">${x.letters.map(
      (l) => `<span class="glyph"><b>${esc(l.ch)}</b><i>${l.symbol}</i></span>`
    ).join('')}</div>` : ''}

    <div class="feet">${x.cards.map(footCard).join('')}</div>

    ${licences.map((L) => `<div class="licence">
      ${[L.name, L.category, L.definition, `${L.from} : ${L.to}`].map(esc).join(' - ')}
    </div>`).join('')}

    ${broken.length ? `<div class="note warn">
      موضع الكسر: ${broken.map((c) => esc(c.name)).join('، ')}
    </div>` : ''}

    ${x.rhyme ? renderRhyme(x.rhyme) : ''}
  </div>`;
}

/**
 * بطاقة التفعيلة: الاسم، والرمز العروضي، والمقابل النصّي، والحالة.
 * لا ترميز LS — ذاك التمثيل الداخلي للمحرك لا للقارئ.
 */
function footCard(c) {
  return `<div class="foot ${c.kind}">
    <div class="foot-name">${esc(c.name) || '—'}</div>
    <div class="foot-symbol">${esc(c.symbol)}</div>
    ${c.text ? `<div class="foot-text">${esc(c.text)}</div>` : ''}
    <div class="foot-state">${esc(c.state)}</div>
  </div>`;
}

function renderRhyme(q) {
  // أسماء الحقول كما هي في عُرف الوزّانين: «نوع القافية» وصفُها
  // بإطلاقها وردفها، و«حدودها» عددُ المتحركات بين ساكنيها.
  const parts = [`الرويّ - ${q.rawi ? q.rawi.letter : '—'}`];
  if (q.ridf) parts.push(`الردف - ${q.ridf.letter}`);
  if (q.tasees) parts.push(`التأسيس - ${q.tasees.letter}، الدخيل - ${q.tasees.dakheel}`);
  if (q.wasl) parts.push(`الوصل - ${q.wasl.letter}`);

  return `<div class="rhyme">
    <div class="rhyme-line"><span class="rhyme-key">القافية</span> ${esc(parts.join('، '))}</div>
    <div class="rhyme-line"><span class="rhyme-key">نوع القافية</span> ${esc(q.classification || '—')}</div>
    <div class="rhyme-line"><span class="rhyme-key">حدودها</span> ${esc(q.type ? q.type.feminine : '—')}${
      q.text ? ` <span class="rhyme-span">${esc(q.text)}</span>` : ''
    }</div>
  </div>`;
}

/* ---------------- تدريب ---------------- */
const ex = engine.exercises();
$('#trainMeter').innerHTML = ex.map((e) => `<option value="${esc(e.id)}">${esc(e.name)}</option>`).join('');
function updateHint() {
  const e = ex.find((x) => x.id === $('#trainMeter').value);
  $('#trainHint').textContent = e ? `${e.tafaeel.join(' | ')} — ${e.syllableCount} مقطعًا` : '';
}
$('#trainMeter').addEventListener('change', updateHint);
updateHint();

$('#runTrain').addEventListener('click', () => {
  const r = engine.train($('#trainInput').value, $('#trainMeter').value);
  if (!r.ok) {
    $('#trainResult').innerHTML = `<div class="panel"><div class="note warn">${esc(r.error)}${r.reason ? '<br>' + esc(r.reason) : ''}</div></div>`;
    return;
  }
  $('#trainResult').innerHTML = `<div class="panel">
    <div class="verdict">
      <span class="name">${r.correct ? 'صحيح' : 'غير صحيح'}</span>
      <span class="badge ${r.correct ? 'sound' : 'broken'}">${pct(r.achievedScore)} / المطلوب ${pct(r.requiredScore)}</span>
    </div>
    ${r.feedback.map((f) => `<div class="note ${f.kind === 'success' ? '' : 'warn'}">${esc(f.text)}</div>`).join('')}
  </div>`;
});

/* ---------------- البحور ---------------- */
$('#metersTable').innerHTML = `
  <tr><th>البحر</th><th>التفعيلات (المصدر): صدر / عجز</th></tr>
  ${engine.listMeters().filter((m) => m.enabled).map((m) => `<tr>
    <td>${esc(m.name)}${m.aliases.length ? `<br><small class="muted">${esc(m.aliases.join('، '))}</small>` : ''}</td>
    <td>${esc(m.sourceQuote)}</td>
  </tr>`).join('')}`;

/* ---------------- تشغيل أولي ---------------- */
// الحقل يُفتح فارغًا: مثالٌ معبّأ يُضطرّ صاحبه إلى مسحه قبل أن يكتب.
render();

}
</script>
